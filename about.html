<script>
/* DB 없이 아래 AB 데이터만으로 완성되는 화면 — boot 를 기다리지 않고 즉시 렌더 */
window.MK_EARLY_RENDER = true;

/* ---------- 렌더 ---------- */
function br(s){ return esc(s).replace(/\n/g,'<br>'); }

function renderAbout(){
  const A = AB;
  document.getElementById('ab-root').innerHTML = `

  <section class="lp-hero buyer">
    <div class="lp-wrap">
      <div class="lp-kick">${esc(L(A.hero.kick))}</div>
      <h1>${br(L(A.hero.h1))}</h1>
      <p class="lead">${esc(L(A.hero.lead))}</p>
      <div class="lp-hero-cta">
        <button class="btn btn-primary" onclick="openAuth('signup')">${esc(t('hero_cta_join'))}</button>
        <a class="btn ghost" href="directory.html">${esc(t('hero_cta_browse'))}</a>
      </div>
      <div class="lp-hero-facts">
        ${A.hero.facts.map(f=>`<div><b>${esc(L(f.n))}</b><span>${esc(L(f.l))}</span></div>`).join('')}
      </div>
    </div>
  </section>

  <section class="lp-sec">
    <div class="lp-wrap">
      <div class="lp-head"><div class="tag">${esc(L(A.problem.tag))}</div>
        <h2>${br(L(A.problem.h2))}</h2><p>${esc(L(A.problem.lead))}</p></div>
      <div class="lp-cards">
        ${A.problem.items.map((x,i)=>`<div class="lp-card"><div class="n">0${i+1}</div>
          <h3>${esc(L(x.t))}</h3><p>${esc(L(x.d))}</p></div>`).join('')}
      </div>
    </div>
  </section>

  <section class="lp-sec soft">
    <div class="lp-wrap">
      <div class="lp-head"><div class="tag">${esc(L(A.vs.tag))}</div><h2>${br(L(A.vs.h2))}</h2></div>
      <table class="lp-vs">
        <thead><tr><th></th><th>${esc(L(A.vs.head)[0])}</th><th>${esc(L(A.vs.head)[1])}</th></tr></thead>
        <tbody>${A.vs.rows.map(r=>`<tr><th>${esc(L(r.k))}</th>
          <td class="old">${esc(L(r.a))}</td><td class="new">${esc(L(r.b))}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </section>

  <section class="ab-lock">
    <div class="wrap">
      <div class="ab-lock-row">
        <div class="ab-lock-tx">
          <div class="ab-tag light">${esc(L(A.lock.tag))}</div>
          <h2>${br(L(A.lock.h2))}</h2>
          <p>${esc(L(A.lock.desc))}</p>
          <p class="ab-lock-note">${esc(L(A.lock.note))}</p>
        </div>
        <div class="ab-lock-demo">
          <div class="pane"><div class="cap">${esc(L(A.lock.before))}</div>
            <div class="rows">
              <div><span>${esc(t('price'))}</span><i class="bar"></i></div>
              <div><span>${esc(t('moq'))}</span><i class="bar"></i></div>
              <div><span>${esc(t('lead_time'))}</span><i class="bar"></i></div>
              <div><span>${esc(t('supply_terms'))}</span><i class="bar"></i></div>
            </div></div>
          <div class="pane on"><div class="cap">${esc(L(A.lock.after))}</div>
            <div class="rows">
              <div><span>${esc(t('price'))}</span><b>US$ 4.20</b></div>
              <div><span>${esc(t('moq'))}</span><b>500</b></div>
              <div><span>${esc(t('lead_time'))}</span><b>30 days</b></div>
              <div><span>${esc(t('supply_terms'))}</span><b>FOB · OEM</b></div>
            </div></div>
        </div>
      </div>
    </div>
  </section>

  <section class="lp-sec">
    <div class="lp-wrap">
      <div class="lp-head"><div class="tag">${esc(L(A.steps.tag))}</div><h2>${esc(L(A.steps.h2))}</h2></div>
      <div class="lp-steps">
        ${A.steps.items.map((x,i)=>`<div class="lp-step on"><div class="st">STEP 0${i+1}</div>
          <h3>${esc(L(x.t))}</h3><p>${esc(L(x.d))}</p></div>`).join('')}
      </div>
    </div>
  </section>

  <section class="lp-sec soft">
    <div class="lp-wrap">
      <div class="lp-head"><div class="tag">${esc(L(A.bens.tag))}</div><h2>${br(L(A.bens.h2))}</h2></div>
      <div class="lp-bens">
        ${A.bens.items.map((x,i)=>`<div class="lp-ben"><div class="k">0${i+1}</div><div>
          <h3>${esc(L(x.t))}</h3><p>${esc(L(x.d))}</p></div></div>`).join('')}
      </div>
    </div>
  </section>

  <section class="lp-sec">
    <div class="lp-wrap">
      <div class="lp-head"><div class="tag">${esc(L(A.verify.tag))}</div>
        <h2>${esc(L(A.verify.h2))}</h2><p>${esc(L(A.verify.desc))}</p></div>
      <div class="ab-vers">
        ${A.verify.items.map(x=>`<div><h3>${esc(L(x.t))}</h3><p>${esc(L(x.d))}</p></div>`).join('')}
      </div>
    </div>
  </section>

  <section class="lp-sec soft">
    <div class="lp-wrap">
      <div class="lp-head"><div class="tag">${esc(L(A.faq.tag))}</div><h2>${esc(L(A.faq.h2))}</h2></div>
      <div class="lp-faq">
        ${A.faq.items.map(x=>`<details><summary>${esc(L(x.q))}</summary>
          <div class="a">${esc(L(x.a))}</div></details>`).join('')}
      </div>
    </div>
  </section>

  <section class="lp-last">
    <div class="lp-wrap">
      <h2>${esc(L(A.last.h2))}</h2>
      <p>${esc(L(A.last.p))}</p>
      <button class="btn btn-primary" onclick="openAuth('signup')">${esc(L(A.last.btn))}</button>
    </div>
  </section>`;
}

function pageInit(){ renderAbout(); }
</script>
