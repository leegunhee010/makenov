<body>
<header class="mk-header" id="mk-header"></header>

<main>

  <!-- 1. 히어로 — 이 서비스의 장치 한 문장 + 지표 스트립 -->
  <section class="ab-hero">
    <div class="wrap">
      <div class="ab-kick" data-i18n="ab_kick"></div>
      <h1 id="ab-title"></h1>
      <p class="ab-lead" data-i18n="ab_lead"></p>
      <div class="ab-hero-cta">
        <button class="btn btn-primary btn-lg" onclick="openAuth('signup')" data-i18n="hero_cta_join"></button>
        <a class="btn btn-ghost btn-lg" href="directory.html" data-i18n="hero_cta_browse"></a>
      </div>
      <div class="ab-stats">
        <div><b data-i18n="ab_s1_n"></b><span data-i18n="ab_s1_l"></span></div>
        <div><b data-i18n="ab_s2_n"></b><span data-i18n="ab_s2_l"></span></div>
        <div><b data-i18n="ab_s3_n"></b><span data-i18n="ab_s3_l"></span></div>
      </div>
    </div>
  </section>

  <!-- 2. 핵심 장치 — 잠금을 말로 설명하지 않고 화면으로 보여준다 -->
  <section class="ab-sec ab-lock">
    <div class="wrap">
      <div class="ab-lock-row">
        <div class="ab-lock-tx">
          <div class="ab-tag light" data-i18n="ab_lock_tag"></div>
          <h2 id="ab-lock-title"></h2>
          <p data-i18n="ab_lock_desc"></p>
          <p class="ab-lock-note" data-i18n="ab_lock_note"></p>
        </div>
        <div class="ab-lock-demo">
          <div class="pane">
            <div class="cap" data-i18n="ab_lock_before"></div>
            <div class="rows">
              <div><span data-i18n="price"></span><i class="bar"></i></div>
              <div><span data-i18n="moq"></span><i class="bar"></i></div>
              <div><span data-i18n="lead_time"></span><i class="bar"></i></div>
              <div><span data-i18n="supply_terms"></span><i class="bar"></i></div>
            </div>
          </div>
          <div class="pane on">
            <div class="cap" data-i18n="ab_lock_after"></div>
            <div class="rows">
              <div><span data-i18n="price"></span><b>US$ 4.20</b></div>
              <div><span data-i18n="moq"></span><b>500</b></div>
              <div><span data-i18n="lead_time"></span><b>30 days</b></div>
              <div><span data-i18n="supply_terms"></span><b>FOB · OEM</b></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. 왜 만들었나 — 카드 대신 큰 번호 + 본문 -->
  <section class="ab-sec">
    <div class="wrap">
      <div class="ab-head">
        <div class="ab-tag" data-i18n="ab_p_tag"></div>
        <h2 id="ab-p-title"></h2>
      </div>
      <div class="ab-probs">
        <div><i>01</i><div><h3 data-i18n="ab_p1_t"></h3><p data-i18n="ab_p1_d"></p></div></div>
        <div><i>02</i><div><h3 data-i18n="ab_p2_t"></h3><p data-i18n="ab_p2_d"></p></div></div>
        <div><i>03</i><div><h3 data-i18n="ab_p3_t"></h3><p data-i18n="ab_p3_d"></p></div></div>
      </div>
    </div>
  </section>

  <!-- 4. 양쪽이 얻는 것 -->
  <section class="ab-sec soft">
    <div class="wrap">
      <div class="ab-head">
        <div class="ab-tag" data-i18n="ab_h_tag"></div>
        <h2 data-i18n="ab_h_title"></h2>
      </div>
      <div class="ab-two">
        <div class="ab-col">
          <div class="ab-col-tag" data-i18n="ab_b_tag"></div>
          <h3 data-i18n="ab_b_title"></h3>
          <ul>
            <li data-i18n="ab_b1"></li><li data-i18n="ab_b2"></li>
            <li data-i18n="ab_b3"></li><li data-i18n="ab_b4"></li>
          </ul>
          <a class="btn btn-primary btn-sm" href="directory.html" data-i18n="hero_cta_browse"></a>
        </div>
        <div class="ab-col dark">
          <div class="ab-col-tag" data-i18n="ab_m_tag"></div>
          <h3 data-i18n="ab_m_title"></h3>
          <ul>
            <li data-i18n="ab_m1"></li><li data-i18n="ab_m2"></li>
            <li data-i18n="ab_m3"></li><li data-i18n="ab_m4"></li>
          </ul>
          <a class="btn btn-sm ab-mbtn" href="maker.html" data-i18n="util_maker"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- 5. 국가별 인증 -->
  <section class="ab-sec">
    <div class="wrap">
      <div class="ab-head">
        <div class="ab-tag" data-i18n="ab_v_tag"></div>
        <h2 data-i18n="ab_v_title"></h2>
        <p data-i18n="ab_v_desc"></p>
      </div>
      <div class="ab-vers">
        <div><h3 data-i18n="ab_v1_t"></h3><p data-i18n="ab_v1_d"></p></div>
        <div><h3 data-i18n="ab_v2_t"></h3><p data-i18n="ab_v2_d"></p></div>
        <div><h3 data-i18n="ab_v3_t"></h3><p data-i18n="ab_v3_d"></p></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <a class="maker-band" href="#" onclick="event.preventDefault();openAuth('signup')">
        <div class="tx"><h2 data-i18n="ab_cta_title"></h2><p data-i18n="ab_cta_desc"></p></div>
        <span class="go" data-i18n="hero_cta_join"></span>
      </a>
    </div>
  </section>

<script>
/* 줄바꿈(\n)이 든 제목은 data-i18n 으로 <br> 처리가 안 된다 */
function pageInit(){
  const br = (id,key)=>{ const el=document.getElementById(id);
    if(el) el.innerHTML = esc(t(key)).replace(/\n/g,'<br>'); };
  br('ab-title','ab_title');
  br('ab-lock-title','ab_lock_title');
  br('ab-p-title','ab_p_title');
}
</script>
