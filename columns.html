<meta property="og:description" content="Xu hướng nhập khẩu, hướng dẫn sourcing và câu chuyện thương hiệu dành cho nhà mua hàng.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Bài viết &amp; Insights | MAKENOV">

</head>
<body>
<header class="mk-header" id="mk-header"></header><main class="wrap"><!-- 히어로 (다른 서브페이지와 동일한 .dir-top 규격) --><div class="dir-top"><h1 data-i18n="nav_columns"></h1><p data-i18n="col_desc"></p></div><!-- 사이드바 + 목록 --><section class="blog-layout"><aside class="blog-sidebar"><div class="blog-search"><input id="col-q" type="search" data-i18n-ph="col_search_ph"
               oninput="colQ=this.value;renderCols()"></div><h3 class="blog-sidebar-tit" data-i18n="col_category"></h3><ul class="blog-cat-list" id="col-cats"></ul></aside><div class="blog-main"><div class="blog-list" id="blog-list"></div></div></section>
</main><!-- 하단 플로팅 CTA -->
<a class="blog-float" href="#" onclick="event.preventDefault();openAuth('signup')"><span data-i18n="col_float_cta"></span>
</a><footer class="mk-footer" id="mk-footer"></footer><script src="assets/js/config.js?v=20260805g"></script>
<script src="assets/js/pixel.js?v=20260805g"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/i18n.js?v=20260805g"></script>
<script src="assets/js/data.js?v=20260805g"></script>
<script src="assets/js/store.js?v=20260805g"></script>
<script src="assets/js/verify.js?v=20260805g"></script>
<script src="assets/js/upload.js?v=20260805g"></script>
<script src="assets/js/store-supabase.js?v=20260805g"></script>
<script src="assets/js/app.js?v=20260805g"></script>
<script>
let colCat = 'all', colQ = '';

/* 카테고리 목록 (중복 제거 + 건수) */
function catList(){
  const map = new Map();
  MK_COLUMNS.forEach(c=>{
    const key = (c.cat && (c.cat.ko || c.cat.vi || c.cat.en)) || '기타';
    map.set(key, (map.get(key)||0) + 1);
  });
  return [...map.entries()];
}

function renderCols(){
  /* 사이드바 */
  const cats = catList();
  document.getElementById('col-cats').innerHTML =
    `<li class="blog-cat-item ${colCat==='all'?'is-active':''}"><a class="blog-cat-link" onclick="colCat='all';renderCols()"><span data-i18n="dir_all"></span><span class="blog-cat-count">(${MK_COLUMNS.length})</span></a></li>` +
    cats.map(([name,n])=>`
      <li class="blog-cat-item ${colCat===name?'is-active':''}"><a class="blog-cat-link" onclick="colCat='${esc(name).replace(/'/g,"\\'")}';renderCols()"><span>${esc(name)}</span><span class="blog-cat-count">(${n})</span></a></li>`).join('');

  /* 목록 필터 */
  const q = colQ.trim().toLowerCase();
  const list = MK_COLUMNS.filter(c=>{
    const key = (c.cat && (c.cat.ko || c.cat.vi || c.cat.en)) || '기타';
    if(colCat!=='all' && key!==colCat) return false;
    if(!q) return true;
    return (Object.values(c.title||{}).join(' ') + Object.values(c.excerpt||{}).join(' '))
             .toLowerCase().includes(q);
  });

  document.getElementById('blog-list').innerHTML = list.length ? list.map(c=>`
    <div class="blog-item"><a class="blog-item-link" href="column.html?id=${c.id}"><div class="blog-item-img"><img src="${c.img}" alt="" loading="lazy"><div class="veil"></div><div class="on-cover"><span class="badge">MAKENOV INSIGHTS</span><div class="ct">${esc(L(c.title))}</div><div class="cs">${esc(L(c.excerpt))}</div><div class="brand">MAKENOV</div></div></div><div class="blog-item-info"><div class="blog-item-cat">${esc(L(c.cat))}</div><h3 class="blog-item-tit">${esc(L(c.title))}</h3><div class="blog-item-meta"><span>${esc(c.date)}</span><i></i><span>${readTime(L(c.body))}</span></div></div></a></div>`).join('') : `<div class="blog-empty" data-i18n="col_empty"></div>`;

  applyI18n(document.querySelector('.blog-layout'));
}

function pageInit(){ renderCols(); }
</script>
</body>
</html>
