<script>
function pageInit(){
  const params = new URLSearchParams(location.search);
  const cat = params.get('category') || '';
  const sort = params.get('sort') || 'new';
  const q = (params.get('q') || '').toLowerCase();

  // filter chips + sort select (Indiegogo-style URL params)
  const fb = document.getElementById('filterbar');
  fb.innerHTML =
    `<a class="chip ${!cat?'on':''}" href="directory.html?sort=${sort}" data-i18n="dir_all"></a>` +
    MK_CATEGORIES.map(c=>
      `<a class="chip ${cat===c.id?'on':''}" href="directory.html?category=${c.id}&sort=${sort}">${esc(L(c.name))}</a>`).join('') +
    `<select class="sortsel" onchange="location.href='directory.html?${cat?'category='+cat+'&':''}sort='+this.value"><option value="new" ${sort==='new'?'selected':''}>${t('sort_new')}</option><option value="popular" ${sort==='popular'?'selected':''}>${t('sort_popular')}</option><option value="inq" ${sort==='inq'?'selected':''}>${t('sort_inq')}</option></select>`;

  let list = MK_PRODUCTS.filter(p=>!cat || p.cat===cat);
  if(q) list = list.filter(p=>
    Object.values(p.name).join(' ').toLowerCase().includes(q) ||
    p.brand.toLowerCase().includes(q) ||
    Object.values(p.tagline).join(' ').toLowerCase().includes(q));
  if(sort==='new') list.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(sort==='popular') list.sort((a,b)=>b.views-a.views);
  if(sort==='inq') list.sort((a,b)=>b.inquiries-a.inquiries);

  document.getElementById('dir-grid').innerHTML = list.map(productCard).join('');
  document.getElementById('dir-empty').style.display = list.length ? 'none':'block';
}
</script>
