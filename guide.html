    body:{
    ko:`<h1>해외 소싱이 처음이어도,<br>이 가이드북 하나면 됩니다</h1>
<p class="gdoc-lead">가입과 인증부터 견적 문의, 그리고 실제 수입까지. 메이크노브를 쓰는 순서 그대로 정리했습니다. 왼쪽 목차에서 필요한 부분을 고르거나, 아래에서 시작하세요.</p>

    vi:`<h1>Lần đầu nhập hàng Hàn Quốc?<br>Cuốn cẩm nang này là đủ</h1>
<p class="gdoc-lead">Từ đăng ký, xác thực đến gửi yêu cầu báo giá và nhập khẩu thực tế — sắp xếp đúng theo thứ tự bạn sẽ dùng MAKENOV. Chọn mục ở menu bên trái, hoặc bắt đầu từ đây.</p>
<div class="gdoc-cards">
<a href="#b-signup" data-art="b-signup"><h3>Cẩm nang nhà mua</h3><p>4 bài: từ đăng ký, xác thực đến nhận báo giá và nhập khẩu</p></a>
<a href="#m-listing" data-art="m-listing"><h3>Cẩm nang nhà sản xuất</h3><p>Quy trình đăng sản phẩm và danh sách tư liệu cần chuẩn bị</p></a>
<a href="#glossary" data-art="glossary"><h3>Từ điển thuật ngữ</h3><p>MOQ, FOB, T/T — những thuật ngữ nên biết trước khi gửi yêu cầu</p></a>
<a href="#trouble" data-art="trouble"><h3>Chỗ hay vướng</h3><p>Xác thực thất bại, đăng nhập, giá bị khóa — cách xử lý từng tình huống</p></a>
</div>`,
    en:`<h1>New to sourcing from Korea?<br>This guidebook covers it all</h1>
<p class="gdoc-lead">From signing up and verifying to requesting quotes and actually importing — organised in the order you'll use MAKENOV. Pick a topic on the left, or start below.</p>
<div class="gdoc-cards">
<a href="#b-signup" data-art="b-signup"><h3>Buyer guide</h3><p>Four articles: from sign-up and verification to quotes and importing</p></a>
<a href="#m-listing" data-art="m-listing"><h3>Manufacturer guide</h3><p>The listing process and a checklist of materials to prepare</p></a>
<a href="#glossary" data-art="glossary"><h3>Trade glossary</h3><p>MOQ, FOB, T/T — terms worth knowing before you send a request</p></a>
<a href="#trouble" data-art="trouble"><h3>Where people get stuck</h3><p>Failed verification, login, locked prices — fixes by situation</p></a>
</div>`}},
  { id:'glossary', title:{ko:'필수 용어 사전',vi:'Từ điển thuật ngữ',en:'Trade glossary'},
    body:{
    ko:`<h1>필수 용어 사전</h1>
<p class="gdoc-lead">제조사와 대화할 때 반복해서 나오는 무역 용어들입니다. 이것만 알아도 문의가 훨씬 매끄러워집니다.</p>
<table class="gdoc-table"><tbody>
<tr><th>MOQ</th><td>최소주문수량(Minimum Order Quantity). 제조사가 한 번에 받아주는 최소 물량입니다. 협의 가능한 경우가 많으니 희망 수량을 먼저 말해보세요.</td></tr>
<tr><th>FOB</th><td>Free On Board. "선적항에서 배에 실을 때까지"의 가격입니다. 그 뒤의 운임·보험·관세는 바이어 부담. 메이크노브의 가격은 대부분 FOB 기준입니다.</td></tr>
<tr><th>CIF</th><td>Cost, Insurance and Freight. 도착항까지의 운임·보험이 포함된 가격. FOB보다 비싸 보여도 총비용은 비슷할 수 있습니다.</td></tr>
<tr><th>리드타임</th><td>발주 확정부터 선적까지 걸리는 시간. 재고가 있으면 짧고, 주문 생산이면 30~60일이 보통입니다.</td></tr>
<tr><th>T/T</th><td>전신환 송금(은행 이체). 첫 거래는 보통 <b>선금 30% + 선적 전 잔금 70%</b>로 진행합니다.</td></tr>
<tr><th>L/C</th><td>신용장. 은행이 지급을 보증하는 방식으로, 거래 이력이 쌓이면 쓸 수 있는 제조사가 많습니다.</td></tr>
<tr><th>C/O</th><td>원산지증명서. 한-베트남 FTA(VKFTA)·한-아세안 FTA 관세 혜택을 받으려면 필요합니다. 제조사에 요청하세요.</td></tr>
<tr><th>PI</th><td>Proforma Invoice(견적송장). 계약 전 최종 조건(품목·수량·단가·납기·결제조건)을 담은 문서. 이걸 기준으로 송금합니다.</td></tr>
<tr><th>OEM / ODM</th><td>OEM은 바이어 브랜드로 생산, ODM은 제조사의 설계·제품을 바이어 브랜드로 공급. 상세페이지의 "OEM/ODM 문의" 표기는 둘 다 열려 있다는 뜻입니다.</td></tr>
<tr><th>샘플 오더</th><td>본 발주 전 소량 확인 주문. 샘플비·운송비는 보통 바이어 부담이고, 본 발주 시 차감해 주는 제조사도 있습니다.</td></tr>
<tr><th>HS코드</th><td>관세 품목분류 번호. 관세율과 수입 요건이 이 번호로 정해지므로 PI에 명시해 달라고 하세요.</td></tr>
</tbody></table>
<div class="gdoc-note">용어가 헷갈리면 문의에 그냥 한국어·베트남어로 풀어 써도 됩니다. 메이크노브 팀이 소통을 도와드립니다.</div>`,
    vi:`<h1>Từ điển thuật ngữ</h1>
<p class="gdoc-lead">Những thuật ngữ thương mại xuất hiện liên tục khi trao đổi với nhà sản xuất. Nắm được chúng, cuộc trao đổi sẽ trôi chảy hơn hẳn.</p>
<table class="gdoc-table"><tbody>
<tr><th>MOQ</th><td>Số lượng đặt hàng tối thiểu. Thường có thể thương lượng — hãy nói số lượng bạn muốn trước.</td></tr>
<tr><th>FOB</th><td>Giá "đến khi hàng lên tàu tại cảng xuất". Cước vận chuyển, bảo hiểm, thuế sau đó do nhà mua chịu. Giá trên MAKENOV phần lớn theo FOB.</td></tr>
<tr><th>CIF</th><td>Giá gồm cả cước và bảo hiểm đến cảng đích. Nhìn cao hơn FOB nhưng tổng chi phí có thể tương đương.</td></tr>
<tr><th>Lead time</th><td>Thời gian từ khi chốt đơn đến khi xuất hàng. Có sẵn kho thì nhanh; sản xuất theo đơn thường 30–60 ngày.</td></tr>
<tr><th>T/T</th><td>Chuyển khoản ngân hàng. Đơn đầu thường là <b>cọc 30% + 70% trước khi giao</b>.</td></tr>
<tr><th>L/C</th><td>Thư tín dụng — ngân hàng bảo lãnh thanh toán. Nhiều nhà sản xuất chấp nhận khi đã có lịch sử giao dịch.</td></tr>
<tr><th>C/O</th><td>Giấy chứng nhận xuất xứ. Cần có để hưởng ưu đãi thuế FTA Việt–Hàn (VKFTA). Hãy yêu cầu nhà sản xuất cung cấp.</td></tr>
<tr><th>PI</th><td>Proforma Invoice — hóa đơn chiếu lệ ghi điều kiện cuối cùng (mặt hàng, số lượng, đơn giá, giao hàng, thanh toán). Chuyển tiền dựa trên PI.</td></tr>
<tr><th>OEM / ODM</th><td>OEM: sản xuất theo thương hiệu của bạn. ODM: sản phẩm của nhà máy mang thương hiệu của bạn. Ghi chú "OEM/ODM" nghĩa là cả hai đều được.</td></tr>
<tr><th>Đơn hàng mẫu</th><td>Đơn nhỏ để kiểm tra trước khi đặt chính thức. Phí mẫu và vận chuyển thường do nhà mua chịu; có nơi trừ lại khi đặt đơn chính.</td></tr>
<tr><th>Mã HS</th><td>Mã phân loại hải quan — quyết định thuế suất và điều kiện nhập khẩu. Hãy yêu cầu ghi rõ trong PI.</td></tr>
</tbody></table>
<div class="gdoc-note">Nếu thuật ngữ khó hiểu, cứ viết bằng tiếng Việt trong yêu cầu báo giá. Đội ngũ MAKENOV sẽ hỗ trợ trao đổi.</div>`,
    en:`<h1>Trade glossary</h1>
<p class="gdoc-lead">The terms that come up again and again when talking to manufacturers. Knowing them makes every conversation smoother.</p>
<table class="gdoc-table"><tbody>
<tr><th>MOQ</th><td>Minimum Order Quantity. Often negotiable — state your target quantity first.</td></tr>
<tr><th>FOB</th><td>Free On Board: the price up to loading at the export port. Freight, insurance and duties after that are on the buyer. Most MAKENOV prices are FOB.</td></tr>
<tr><th>CIF</th><td>Cost, Insurance and Freight to the destination port. Looks higher than FOB but total cost can be similar.</td></tr>
<tr><th>Lead time</th><td>Time from confirmed order to shipment. Short if in stock; made-to-order typically runs 30–60 days.</td></tr>
<tr><th>T/T</th><td>Bank wire transfer. First orders usually run <b>30% deposit + 70% before shipment</b>.</td></tr>
<tr><th>L/C</th><td>Letter of credit — bank-guaranteed payment. Many manufacturers accept it once a track record exists.</td></tr>
<tr><th>C/O</th><td>Certificate of Origin. Needed for FTA tariff benefits (e.g. VKFTA). Ask the manufacturer to provide it.</td></tr>
<tr><th>PI</th><td>Proforma Invoice — the final terms (items, quantity, unit price, delivery, payment) before contract. You wire money against the PI.</td></tr>
<tr><th>OEM / ODM</th><td>OEM: made under your brand. ODM: the factory's own design supplied under your brand. "OEM/ODM available" means both are open.</td></tr>
<tr><th>Sample order</th><td>A small check order before the main one. Sample and shipping costs are usually on the buyer; some makers credit them back.</td></tr>
<tr><th>HS code</th><td>The customs classification that sets duty rates and import requirements. Ask for it on the PI.</td></tr>
</tbody></table>
<div class="gdoc-note">If a term is unclear, just write plainly in your own language — the MAKENOV team helps with communication.</div>`}},
]},

  { id:'b-signup', title:{ko:'가입과 사업자 인증',vi:'Đăng ký & xác thực',en:'Sign-up & verification'},
    body:{
    ko:`<h1>가입과 사업자 인증</h1>
<p class="gdoc-lead">메이크노브의 모든 것은 "인증된 사업자만 가격을 본다"에서 출발합니다. 그래서 가입에 사업자 인증이 붙어 있습니다 — 무료이고, 보통 1분이면 끝납니다.</p>
<h2>왜 인증을 요구하나요</h2>
<p>제조사가 단가를 공개하는 조건이 "경쟁사·구경꾼이 아니라 실제 바이어에게만"이기 때문입니다. 인증을 통과하면 가격·MOQ·납기·공급 조건이 전부 열리고, 문의에 회사 정보가 자동으로 실려 제조사의 답변도 빨라집니다.</p>
<h2>국가별 인증 방법</h2>
<table class="gdoc-table"><tbody>
<tr><th>베트남</th><td>세금코드(MST) 입력 → 국가 시스템에서 자동 조회되어 회사명·주소가 채워집니다.</td></tr>
<tr><th>한국</th><td>사업자등록번호 입력 → 국세청에서 계속사업자 여부를 확인합니다.</td></tr>
<tr><th>그 외 국가</th><td>회사 이메일 도메인으로 인증합니다. Gmail 등 무료 메일은 사용할 수 없습니다.</td></tr>
</tbody></table>
<h2>가입 절차</h2>
<ol class="gdoc-ol">
<li>우측 상단 <b>회원가입</b> → 국가 선택</li>
<li>사업자 번호(또는 회사 이메일) 인증 — 실패하면 화면의 <b>간편 문의</b>로 넘어가세요. 담당자가 직접 인증을 도와드립니다</li>
<li>담당자 이름·연락처·비밀번호 입력 → 완료</li>
<li>확인 메일의 링크를 누르면 로그인됩니다</li>
</ol>
<div class="gdoc-note">가입 후 정보가 바뀌었거나 인증이 비어 있으면 <b>마이페이지 → 기업 프로필 → 재인증하기</b>로 언제든 다시 채울 수 있습니다.</div>`,
    vi:`<h1>Đăng ký & xác thực doanh nghiệp</h1>
<p class="gdoc-lead">Mọi thứ ở MAKENOV bắt đầu từ nguyên tắc "chỉ doanh nghiệp đã xác thực mới xem giá". Vì vậy đăng ký đi kèm xác thực — miễn phí và thường chỉ mất một phút.</p>
<h2>Vì sao phải xác thực</h2>
<p>Nhà sản xuất chỉ đồng ý mở đơn giá khi biết người xem là nhà mua thật, không phải đối thủ. Qua xác thực, giá, MOQ, thời gian giao và điều kiện cung ứng đều mở; yêu cầu báo giá tự động kèm thông tin công ty nên nhà sản xuất trả lời cũng nhanh hơn.</p>
<h2>Cách xác thực theo quốc gia</h2>
<table class="gdoc-table"><tbody>
<tr><th>Việt Nam</th><td>Nhập mã số thuế (MST) → hệ thống tra cứu tự động, tên và địa chỉ công ty tự điền.</td></tr>
<tr><th>Hàn Quốc</th><td>Nhập số đăng ký kinh doanh → đối chiếu trạng thái với cơ quan thuế.</td></tr>
<tr><th>Quốc gia khác</th><td>Xác thực bằng email tên miền công ty. Không dùng được Gmail hay email miễn phí.</td></tr>
</tbody></table>
<h2>Các bước đăng ký</h2>
<ol class="gdoc-ol">
<li>Bấm <b>Đăng ký</b> góc phải trên → chọn quốc gia</li>
<li>Xác thực mã số (hoặc email công ty) — nếu thất bại, dùng <b>gửi yêu cầu nhanh</b> trên màn hình, chúng tôi sẽ hỗ trợ xác thực trực tiếp</li>
<li>Nhập tên người phụ trách, liên hệ, mật khẩu → hoàn tất</li>
<li>Bấm liên kết trong email xác nhận để đăng nhập</li>
</ol>
<div class="gdoc-note">Nếu thông tin thay đổi hoặc hồ sơ còn trống, vào <b>Trang của tôi → Hồ sơ doanh nghiệp → Xác thực lại</b> bất cứ lúc nào.</div>`,
    en:`<h1>Sign-up & business verification</h1>
<p class="gdoc-lead">Everything at MAKENOV starts from one rule: only verified businesses see prices. That's why sign-up includes verification — free, and usually done in a minute.</p>
<h2>Why we verify</h2>
<p>Manufacturers only agree to open their pricing to real buyers, not competitors or onlookers. Once verified, price, MOQ, lead time and supply terms all unlock, and your requests carry your company details automatically — which also makes manufacturers reply faster.</p>
<h2>How each country verifies</h2>
<table class="gdoc-table"><tbody>
<tr><th>Vietnam</th><td>Enter your tax code (MST) → looked up automatically; company name and address fill in.</td></tr>
<tr><th>Korea</th><td>Enter the business registration number → status checked with the tax office.</td></tr>
<tr><th>Elsewhere</th><td>Verify by company email domain. Gmail and other free providers are not accepted.</td></tr>
</tbody></table>
<h2>Steps</h2>
<ol class="gdoc-ol">
<li>Click <b>Sign up</b> top right → choose your country</li>
<li>Verify your number (or company email) — if it fails, use the on-screen <b>quick enquiry</b> and we'll verify you manually</li>
<li>Enter contact name, phone and password → done</li>
<li>Click the link in the confirmation email to log in</li>
</ol>
<div class="gdoc-note">If details change or your profile is empty, go to <b>My page → Company profile → Re-verify</b> any time.</div>`}},
  { id:'b-pricing', title:{ko:'가격·MOQ 읽는 법',vi:'Đọc giá & MOQ',en:'Reading price & MOQ'},
    body:{
    ko:`<h1>가격·MOQ 읽는 법</h1>
<p class="gdoc-lead">로그인 전에는 "인증 후 열람"으로 잠겨 있던 네 줄이, 인증하면 이렇게 열립니다. 각 항목이 뜻하는 것부터 봅시다.</p>
<table class="gdoc-table"><tbody>
<tr><th>가격</th><td>대부분 <b>FOB 기준 USD</b>입니다. 즉 한국 선적항까지의 가격이고, 해상운임·보험·베트남 관세와 부가세는 별도입니다. 총 수입원가는 대략 FOB가 + 운임 + (관세율 × 과세가격)으로 잡으세요.</td></tr>
<tr><th>MOQ</th><td>최소주문수량. <b>협의 가능</b> 배지가 붙어 있으면 제조사가 소량 테스트 오더에 열려 있다는 뜻입니다.</td></tr>
<tr><th>납기</th><td>발주 확정 후 선적까지의 기간. "문의"로 되어 있으면 물량에 따라 달라진다는 의미입니다.</td></tr>
<tr><th>공급 조건</th><td>OEM/ODM 가능 여부, 인증 보유, 참고 소매가 같은 부가 정보가 들어갑니다.</td></tr>
</tbody></table>
<h2>제품 카드의 숫자들</h2>
<p><b>문의 수</b>는 이 제품에 들어온 견적 문의 건수, <b>관심</b>은 담아둔 바이어 수입니다. 문의가 몰리는 제품은 답변이 하루이틀 늦어질 수 있습니다.</p>
<div class="gdoc-note">가격이 "문의"로 표시된 제품도 있습니다 — 제조사가 물량·조건별로 견적을 내는 경우입니다. 그냥 견적 문의를 보내면 됩니다.</div>`,
    vi:`<h1>Đọc giá & MOQ thế nào</h1>
<p class="gdoc-lead">Bốn dòng bị khóa "xem sau khi xác thực" sẽ mở ra sau khi bạn xác thực. Trước hết hãy hiểu từng mục nghĩa là gì.</p>
<table class="gdoc-table"><tbody>
<tr><th>Giá</th><td>Phần lớn là <b>USD theo FOB</b> — giá đến cảng xuất Hàn Quốc; cước biển, bảo hiểm, thuế nhập và VAT Việt Nam tính riêng. Ước giá vốn nhập ≈ FOB + cước + (thuế suất × trị giá tính thuế).</td></tr>
<tr><th>MOQ</th><td>Số lượng tối thiểu. Có nhãn <b>Có thể thương lượng</b> nghĩa là nhà sản xuất sẵn sàng nhận đơn thử số lượng nhỏ.</td></tr>
<tr><th>Giao hàng</th><td>Thời gian từ chốt đơn đến xuất hàng. Ghi "liên hệ" nghĩa là tùy số lượng.</td></tr>
<tr><th>Điều kiện</th><td>OEM/ODM, chứng nhận, giá bán lẻ tham khảo và các thông tin bổ sung.</td></tr>
</tbody></table>
<h2>Các con số trên thẻ sản phẩm</h2>
<p><b>Số yêu cầu</b> là số lượt hỏi báo giá; <b>quan tâm</b> là số nhà mua đã lưu sản phẩm. Sản phẩm nhiều yêu cầu có thể trả lời chậm hơn một hai ngày.</p>
<div class="gdoc-note">Một số sản phẩm ghi giá "liên hệ" — nhà sản xuất báo giá theo số lượng và điều kiện. Cứ gửi yêu cầu báo giá bình thường.</div>`,
    en:`<h1>Reading price & MOQ</h1>
<p class="gdoc-lead">The four locked lines open once you verify. Here's what each one means.</p>
<table class="gdoc-table"><tbody>
<tr><th>Price</th><td>Mostly <b>USD on FOB terms</b> — up to the Korean export port; ocean freight, insurance, import duty and VAT are separate. Rough landed cost ≈ FOB + freight + (duty rate × customs value).</td></tr>
<tr><th>MOQ</th><td>Minimum order quantity. A <b>Negotiable</b> badge means the maker is open to small trial orders.</td></tr>
<tr><th>Lead time</th><td>From confirmed order to shipment. "On request" means it depends on volume.</td></tr>
<tr><th>Terms</th><td>OEM/ODM availability, certifications, reference retail price and other extras.</td></tr>
</tbody></table>
<h2>The numbers on product cards</h2>
<p><b>Inquiries</b> counts quotation requests; <b>interested</b> counts buyers who saved the product. Popular products may reply a day or two slower.</p>
<div class="gdoc-note">Some products show price as "on request" — the maker quotes by volume and terms. Just send a quotation request as usual.</div>`}},
  { id:'b-inquiry', title:{ko:'견적 문의 잘 보내기',vi:'Gửi yêu cầu báo giá',en:'Writing a good request'},
    body:{
    ko:`<h1>견적 문의 잘 보내기</h1>
<p class="gdoc-lead">문의는 제조사에 그대로 전달됩니다. 처음 한 통에 아래 내용이 들어 있으면 왕복 두세 번을 아낄 수 있습니다.</p>
<h2>이것만은 적어주세요</h2>
<ul class="gdoc-ul">
<li><b>희망 수량</b> — "MOQ가 높으면 첫 주문은 500개로 시작하고 싶다"처럼 계획을 함께</li>
<li><b>필요 시기</b> — 판매 시즌이 있다면 언제까지 받아야 하는지</li>
<li><b>판매 채널</b> — 약국·화장품 매장·온라인 등. 제조사가 조건을 맞추는 데 중요합니다</li>
<li><b>요청 서류</b> — 성분표, C/O, 시험성적서 등 필요한 문서</li>
</ul>
<h2>여러 제품을 한 번에</h2>
<p>제품마다 따로 보낼 필요 없습니다. 관심제품에 담아두고 <b>마이페이지 → 관심제품 → 일괄 견적 요청</b>을 누르면 담긴 제품 전체가 한 번에 문의됩니다.</p>
<h2>보낸 뒤에는</h2>
<p>마이페이지 <b>내 문의</b>에서 상태를 볼 수 있습니다 — <b>접수됨</b>(제조사 전달) → <b>처리 중</b>(확인 중) → <b>답변 완료</b>. 답변은 남긴 이메일·연락처로 옵니다. 영업일 2~3일이 지나도 소식이 없으면 고객센터에 알려주세요. 저희가 제조사를 찔러드립니다.</p>`,
    vi:`<h1>Gửi yêu cầu báo giá hiệu quả</h1>
<p class="gdoc-lead">Yêu cầu của bạn được chuyển nguyên văn tới nhà sản xuất. Một bức đầu tiên đủ ý sẽ tiết kiệm hai ba lượt hỏi đáp.</p>
<h2>Nhớ ghi những điều này</h2>
<ul class="gdoc-ul">
<li><b>Số lượng mong muốn</b> — kèm kế hoạch, ví dụ "MOQ cao thì đơn đầu xin bắt đầu 500 cái"</li>
<li><b>Thời điểm cần hàng</b> — nếu bán theo mùa, cần nhận trước ngày nào</li>
<li><b>Kênh bán</b> — nhà thuốc, cửa hàng mỹ phẩm, online… giúp nhà sản xuất đưa điều kiện phù hợp</li>
<li><b>Giấy tờ cần</b> — bảng thành phần, C/O, phiếu kiểm nghiệm…</li>
</ul>
<h2>Nhiều sản phẩm cùng lúc</h2>
<p>Không cần gửi từng cái. Lưu vào danh sách quan tâm rồi bấm <b>Trang của tôi → Quan tâm → Gửi yêu cầu hàng loạt</b> — tất cả sản phẩm đã lưu được hỏi trong một lần.</p>
<h2>Sau khi gửi</h2>
<p>Xem trạng thái tại <b>Yêu cầu của tôi</b>: <b>Đã tiếp nhận</b> (đã chuyển tới nhà sản xuất) → <b>Đang xử lý</b> → <b>Đã trả lời</b>. Câu trả lời gửi về email/số liên hệ bạn để lại. Quá 2–3 ngày làm việc chưa có tin, hãy báo bộ phận hỗ trợ — chúng tôi sẽ nhắc nhà sản xuất.</p>`,
    en:`<h1>Writing a request that gets answered</h1>
<p class="gdoc-lead">Your request goes to the manufacturer as-is. Getting these into the first message saves two or three back-and-forths.</p>
<h2>Always include</h2>
<ul class="gdoc-ul">
<li><b>Target quantity</b> — with your plan, e.g. "if the MOQ is high, we'd start with 500 units"</li>
<li><b>When you need it</b> — especially if your sales are seasonal</li>
<li><b>Sales channel</b> — pharmacy, cosmetics stores, online… it shapes the terms the maker can offer</li>
<li><b>Documents you need</b> — ingredient list, C/O, test reports…</li>
</ul>
<h2>Several products at once</h2>
<p>No need to send one by one. Save products to your wishlist, then hit <b>My page → Wishlist → bulk request</b> — every saved product goes in a single request.</p>
<h2>After sending</h2>
<p>Track status under <b>My inquiries</b>: <b>Received</b> (forwarded to the maker) → <b>In progress</b> → <b>Answered</b>. Replies come to the email/phone you left. If 2–3 business days pass with nothing, tell support — we'll nudge the manufacturer.</p>`}},
  { id:'b-flow', title:{ko:'문의 후 수입까지의 흐름',vi:'Từ báo giá đến nhập khẩu',en:'From quote to import'},
    body:{
    ko:`<h1>문의 후 수입까지의 흐름</h1>
<p class="gdoc-lead">견적을 받았다면 그 다음은 일반적인 수입 절차입니다. 첫 거래 기준으로 순서를 정리했습니다.</p>
<ol class="gdoc-ol big">
<li><b>견적 확인</b> — 단가·MOQ·납기·결제조건을 받습니다. 항목이 빠졌으면 이 단계에서 다 물어보세요.</li>
<li><b>샘플</b> — 소량 샘플로 품질을 확인합니다. 샘플비·특송비는 보통 바이어 부담입니다.</li>
<li><b>조건 확정 → PI 수령</b> — 협의가 끝나면 제조사가 PI(견적송장)를 보냅니다. 품목·수량·단가·납기·결제조건·HS코드가 다 들어 있는지 확인하세요. <b>말로 한 약속은 PI에 적혀야 유효합니다.</b></li>
<li><b>결제</b> — 첫 거래는 T/T 선금 30%가 일반적입니다. 송금 계좌명이 계약 상대 회사와 일치하는지 꼭 확인하세요.</li>
<li><b>생산·선적</b> — 납기는 PI 기준으로 카운트됩니다. 선적 후 B/L(선하증권)·인보이스·패킹리스트·C/O를 받습니다.</li>
<li><b>통관·수령</b> — 통관사(포워더)에 서류를 넘기면 관세·VAT 납부 후 물건을 받습니다. 화장품·식품은 사전 공고(등록) 절차가 있으니 주문 전에 확인하세요.</li>
</ol>
<div class="gdoc-note">화장품·식품·의료기기는 베트남 수입 시 제품 공고/등록이 선행되어야 합니다. 제조사에 "베트남 공고용 서류를 줄 수 있는지" 먼저 확인하면 시행착오가 줄어듭니다.</div>`,
    vi:`<h1>Từ báo giá đến nhập khẩu</h1>
<p class="gdoc-lead">Nhận được báo giá rồi thì phần còn lại là quy trình nhập khẩu thông thường. Dưới đây là thứ tự cho lần giao dịch đầu tiên.</p>
<ol class="gdoc-ol big">
<li><b>Xem báo giá</b> — nhận đơn giá, MOQ, thời gian giao, điều kiện thanh toán. Thiếu mục nào, hỏi ngay ở bước này.</li>
<li><b>Hàng mẫu</b> — kiểm tra chất lượng bằng mẫu. Phí mẫu và chuyển phát thường do nhà mua chịu.</li>
<li><b>Chốt điều kiện → nhận PI</b> — nhà sản xuất gửi Proforma Invoice. Kiểm tra đủ: mặt hàng, số lượng, đơn giá, giao hàng, thanh toán, mã HS. <b>Thỏa thuận miệng chỉ có giá trị khi được ghi vào PI.</b></li>
<li><b>Thanh toán</b> — đơn đầu thường T/T cọc 30%. Nhớ đối chiếu tên tài khoản nhận tiền trùng với công ty ký kết.</li>
<li><b>Sản xuất & xuất hàng</b> — lead time tính theo PI. Sau khi xuất, nhận B/L, invoice, packing list và C/O.</li>
<li><b>Thông quan & nhận hàng</b> — chuyển hồ sơ cho forwarder, nộp thuế nhập và VAT rồi nhận hàng. Mỹ phẩm, thực phẩm cần công bố sản phẩm trước — kiểm tra trước khi đặt.</li>
</ol>
<div class="gdoc-note">Mỹ phẩm, thực phẩm, thiết bị y tế phải công bố/đăng ký trước khi nhập vào Việt Nam. Hỏi trước nhà sản xuất "có cung cấp hồ sơ công bố cho Việt Nam không" sẽ đỡ mất thời gian thử sai.</div>`,
    en:`<h1>From quote to import</h1>
<p class="gdoc-lead">Once you have a quote, the rest is a standard import flow. Here it is for a first transaction.</p>
<ol class="gdoc-ol big">
<li><b>Review the quote</b> — unit price, MOQ, lead time, payment terms. Ask about anything missing now.</li>
<li><b>Samples</b> — check quality with a small sample. Sample and courier costs are usually on the buyer.</li>
<li><b>Fix terms → receive the PI</b> — the maker sends a Proforma Invoice. Check it covers items, quantity, unit price, delivery, payment and HS code. <b>Verbal promises only count once written into the PI.</b></li>
<li><b>Payment</b> — first orders typically run 30% T/T deposit. Make sure the receiving account name matches the contracting company.</li>
<li><b>Production & shipment</b> — lead time counts from the PI. After shipping you receive the B/L, invoice, packing list and C/O.</li>
<li><b>Customs & delivery</b> — hand documents to your forwarder, pay duty and VAT, receive the goods. Cosmetics and food need prior product notification — check before ordering.</li>
</ol>
<div class="gdoc-note">Cosmetics, food and medical devices require product notification/registration before import. Asking the maker up front whether they can supply the dossier saves a lot of trial and error.</div>`}},
]},

{ label:{ko:'제조사 가이드',vi:'Cẩm nang nhà sản xuất',en:'Manufacturer guide'},
  icon:'<svg viewBox="0 0 24 24"><path d="M3 20V11l5 3V11l5 3V6l8 5v9z"/><path d="M3 20h18"/></svg>',
  items:[
  { id:'m-listing', title:{ko:'제품 등록 절차',vi:'Quy trình đăng sản phẩm',en:'Listing process'},
    body:{
    ko:`<h1>제품 등록 절차</h1>
<p class="gdoc-lead">제조사가 할 일은 자료를 주는 것까지입니다. 번역, 3개 국어 상세페이지 제작, 기업 프로필 구성, 광고 노출은 메이크노브가 합니다. 등록비는 없습니다.</p>
<ol class="gdoc-ol big">
<li><b>등록 문의</b> — <a href="maker.html">제품 등록 문의</a> 양식에 회사와 제품만 남겨주세요. 5분이면 충분합니다. 영업일 2일 이내에 연락드립니다.</li>
<li><b>자료 전달</b> — 제품 사진, 규격, 수출 단가(FOB), MOQ를 보내주세요. 기존 카탈로그 PDF·상세페이지가 있으면 그대로 주셔도 됩니다. 상세 목록은 다음 장 <a href="#m-materials" data-art="m-materials">준비 자료 체크리스트</a>에 있습니다.</li>
<li><b>3개 국어 등록</b> — 베트남어·영어·한국어 상세페이지와 기업 프로필을 만들어 게시합니다. 자료가 다 모인 뒤 통상 영업일 5일 이내입니다. 게시 전에 확인을 받습니다.</li>
<li><b>문의 수신</b> — 인증 바이어의 견적 문의가 회사명·담당자·연락처와 함께 이메일로 전달됩니다. 답변은 제조사가 직접, 소통이 어려우면 메이크노브가 돕습니다.</li>
</ol>
<h2>자주 묻는 것</h2>
<ul class="gdoc-ul">
<li><b>단가가 노출되지 않나요?</b> — 가격·MOQ는 사업자 인증을 통과한 바이어에게만 전송됩니다. 비로그인 화면과 검색엔진에는 아예 실리지 않습니다.</li>
<li><b>독점인가요?</b> — 아닙니다. 다른 플랫폼에 올라가 있어도 등록할 수 있습니다.</li>
<li><b>수출 경험이 없어도 되나요?</b> — 됩니다. 단, 수출 단가와 MOQ는 정해두셔야 합니다. 바이어가 가장 먼저 묻는 두 가지입니다.</li>
</ul>`,
    vi:`<h1>Quy trình đăng sản phẩm</h1>
<p class="gdoc-lead">Nhà sản xuất chỉ cần cung cấp tư liệu. Dịch thuật, làm trang chi tiết ba ngôn ngữ, hồ sơ công ty và quảng bá do MAKENOV đảm nhận. Không thu phí đăng.</p>
<ol class="gdoc-ol big">
<li><b>Gửi yêu cầu đăng</b> — điền công ty và sản phẩm vào <a href="maker.html">biểu mẫu</a>. Khoảng 5 phút. Chúng tôi liên hệ trong 2 ngày làm việc.</li>
<li><b>Gửi tư liệu</b> — ảnh sản phẩm, quy cách, giá FOB, MOQ. Có catalogue PDF sẵn thì gửi nguyên bản. Danh sách đầy đủ ở bài <a href="#m-materials" data-art="m-materials">Checklist tư liệu</a>.</li>
<li><b>Đăng bằng 3 ngôn ngữ</b> — chúng tôi làm trang chi tiết và hồ sơ công ty bằng tiếng Việt, Hàn, Anh. Thường trong 5 ngày làm việc kể từ khi đủ tư liệu; duyệt trước khi đăng.</li>
<li><b>Nhận yêu cầu</b> — yêu cầu báo giá của nhà mua đã xác thực gửi về email kèm tên công ty, người phụ trách, liên hệ. Nhà sản xuất trả lời trực tiếp; khó trao đổi thì MAKENOV hỗ trợ.</li>
</ol>
<h2>Hay được hỏi</h2>
<ul class="gdoc-ul">
<li><b>Đơn giá có bị lộ không?</b> — Giá và MOQ chỉ gửi cho nhà mua đã xác thực; màn hình chưa đăng nhập và công cụ tìm kiếm hoàn toàn không thấy.</li>
<li><b>Có độc quyền không?</b> — Không. Đang bán trên nền tảng khác vẫn đăng được.</li>
<li><b>Chưa từng xuất khẩu?</b> — Không sao, nhưng cần chốt sẵn giá xuất và MOQ — hai điều nhà mua hỏi đầu tiên.</li>
</ul>`,
    en:`<h1>Listing process</h1>
<p class="gdoc-lead">Your job ends at handing over materials. Translation, three-language detail pages, the company profile and promotion are on MAKENOV. There is no listing fee.</p>
<ol class="gdoc-ol big">
<li><b>Send a listing request</b> — fill in company and product on the <a href="maker.html">form</a>. About five minutes; we reply within two business days.</li>
<li><b>Send materials</b> — product photos, specs, FOB price, MOQ. An existing catalogue PDF is fine as-is. Full list in <a href="#m-materials" data-art="m-materials">the materials checklist</a>.</li>
<li><b>We publish in three languages</b> — Vietnamese, Korean and English detail pages plus a company profile, usually within five business days of receiving everything. You approve before it goes live.</li>
<li><b>Receive requests</b> — verified buyers' requests arrive by email with company, contact person and details. You reply directly; MAKENOV helps when communication is hard.</li>
</ol>
<h2>Common questions</h2>
<ul class="gdoc-ul">
<li><b>Will my pricing leak?</b> — Price and MOQ are sent only to verified buyers; logged-out pages and search engines never carry them.</li>
<li><b>Is it exclusive?</b> — No. Being on other platforms is fine.</li>
<li><b>No export experience?</b> — That's fine, but fix your export price and MOQ first — the two things buyers ask about immediately.</li>
</ul>`}},
  { id:'m-materials', title:{ko:'준비 자료 체크리스트',vi:'Checklist tư liệu',en:'Materials checklist'},
    body:{
    ko:`<h1>준비 자료 체크리스트</h1>
<p class="gdoc-lead">이 목록대로 보내주시면 등록이 한 번에 끝납니다. 전부 있어야 시작하는 건 아니고, 굵은 것 네 가지가 핵심입니다.</p>
<table class="gdoc-table"><tbody>
<tr><th>대표 사진 <i>필수</i></th><td>제품 단독 컷 1장 이상, 가로 1000px 이상. 배경이 깔끔할수록 좋습니다.</td></tr>
<tr><th>수출 단가 <i>필수</i></th><td>FOB 기준 USD. 소매가가 아니라 수출·도매가입니다. 수량 구간별 단가가 있으면 더 좋습니다.</td></tr>
<tr><th>MOQ <i>필수</i></th><td>최소주문수량과, 소량 테스트 오더 협의 가능 여부.</td></tr>
<tr><th>제품 규격 <i>필수</i></th><td>용량/중량, 박스 입수량, 카톤 치수·무게. 운임 견적에 필요합니다.</td></tr>
<tr><th>상세페이지</th><td>기존 쇼핑몰 상세페이지 이미지를 그대로 주셔도 됩니다(세로로 긴 이미지 여러 장 가능). 없으면 제품 설명 텍스트로 대신합니다.</td></tr>
<tr><th>인증·시험성적</th><td>기능성 심사, 시험성적서, 특허, ISO/IATF 등. 바이어 신뢰에 가장 크게 작용합니다.</td></tr>
<tr><th>회사 소개</th><td>설립연도, 대표, 주요 거래처·수출 실적, 생산능력. 기업 프로필 페이지에 들어갑니다.</td></tr>
<tr><th>카탈로그 PDF</th><td>있으면 바이어가 다운로드할 수 있게 걸어둡니다.</td></tr>
<tr><th>영상</th><td>유튜브 링크면 충분합니다. 상세페이지에 임베드됩니다.</td></tr>
</tbody></table>
<div class="gdoc-note">사진이 마땅치 않아도 일단 보내주세요. 쓸 수 있는 수준인지 확인하고, 부족하면 어떤 컷이 필요한지 목록으로 알려드립니다.</div>`,
    vi:`<h1>Checklist tư liệu cần chuẩn bị</h1>
<p class="gdoc-lead">Gửi đúng theo danh sách này, việc đăng xong trong một lần. Không cần đủ hết mới bắt đầu — bốn mục in đậm là cốt lõi.</p>
<table class="gdoc-table"><tbody>
<tr><th>Ảnh đại diện <i>bắt buộc</i></th><td>Ít nhất 1 ảnh sản phẩm riêng, ngang từ 1000px. Nền càng sạch càng tốt.</td></tr>
<tr><th>Giá xuất khẩu <i>bắt buộc</i></th><td>USD theo FOB — giá xuất/sỉ, không phải giá lẻ. Có bảng giá theo số lượng càng tốt.</td></tr>
<tr><th>MOQ <i>bắt buộc</i></th><td>Số lượng tối thiểu và có nhận đơn thử nhỏ hay không.</td></tr>
<tr><th>Quy cách <i>bắt buộc</i></th><td>Dung tích/khối lượng, số cái mỗi hộp, kích thước & cân nặng carton — cần cho báo giá cước.</td></tr>
<tr><th>Trang chi tiết</th><td>Gửi nguyên ảnh trang chi tiết đang dùng cũng được (nhiều ảnh dọc dài đều xử lý được). Không có thì thay bằng văn bản mô tả.</td></tr>
<tr><th>Chứng nhận · kiểm nghiệm</th><td>Chứng nhận chức năng, phiếu kiểm nghiệm, bằng sáng chế, ISO/IATF — tác động lớn nhất tới niềm tin của nhà mua.</td></tr>
<tr><th>Giới thiệu công ty</th><td>Năm thành lập, đại diện, khách hàng & thành tích xuất khẩu, năng lực sản xuất.</td></tr>
<tr><th>Catalogue PDF</th><td>Nếu có, sẽ gắn cho nhà mua tải về.</td></tr>
<tr><th>Video</th><td>Link YouTube là đủ — sẽ nhúng vào trang chi tiết.</td></tr>
</tbody></table>
<div class="gdoc-note">Ảnh chưa ưng ý vẫn cứ gửi. Chúng tôi xem có dùng được không, thiếu góc nào sẽ gửi danh sách cụ thể.</div>`,
    en:`<h1>Materials checklist</h1>
<p class="gdoc-lead">Send things per this list and listing finishes in one pass. You don't need everything to start — the four bold items are the core.</p>
<table class="gdoc-table"><tbody>
<tr><th>Hero photo <i>required</i></th><td>At least one standalone product shot, 1000px+ wide. The cleaner the background, the better.</td></tr>
<tr><th>Export price <i>required</i></th><td>USD on FOB terms — export/wholesale, not retail. Volume-tiered pricing is even better.</td></tr>
<tr><th>MOQ <i>required</i></th><td>Minimum quantity, and whether small trial orders are negotiable.</td></tr>
<tr><th>Specs <i>required</i></th><td>Volume/weight, units per box, carton dimensions & weight — needed for freight quotes.</td></tr>
<tr><th>Detail page</th><td>Your existing shop detail images are fine as-is (multiple tall images OK). If none, plain descriptive text works.</td></tr>
<tr><th>Certifications & tests</th><td>Functional approvals, test reports, patents, ISO/IATF — the single biggest driver of buyer trust.</td></tr>
<tr><th>Company intro</th><td>Founding year, CEO, key clients & export record, production capacity.</td></tr>
<tr><th>Catalogue PDF</th><td>If available, we attach it for buyers to download.</td></tr>
<tr><th>Video</th><td>A YouTube link is enough — it gets embedded on the page.</td></tr>
</tbody></table>
<div class="gdoc-note">Not proud of your photos? Send them anyway. We'll check whether they're usable and send a shot list for anything missing.</div>`}},
]},

  { id:'trouble', title:{ko:'자주 막히는 곳',vi:'Chỗ hay vướng',en:'Where people get stuck'},
    body:{
    ko:`<h1>자주 막히는 곳</h1>
<p class="gdoc-lead">상황별로 정리했습니다. 여기 없는 문제는 <a href="support.html">고객센터</a>로 보내주세요 — 영업일 2일 이내에 답합니다.</p>
<div class="faq-list">
<details class="faq-item"><summary>사업자 인증이 통과되지 않아요</summary><div class="a">번호가 정확한지, 그리고 폐업·휴업 상태가 아닌지 먼저 확인해 주세요. 베트남 MST는 하이픈 없이 숫자만 입력합니다. 그래도 안 되면 가입 화면의 <b>간편 문의</b>로 넘어가세요 — 담당자가 연락드려 직접 인증을 도와드립니다.</div></details>
<details class="faq-item"><summary>가입은 했는데 로그인이 안 돼요</summary><div class="a">대부분 확인 메일을 안 누르신 경우입니다. 받은편지함과 스팸함을 확인해 주세요. 로그인 화면에 <b>확인 메일 재발송</b> 버튼도 있습니다. 비밀번호를 잊었다면 재설정 링크를 이용하세요.</div></details>
<details class="faq-item"><summary>로그인했는데 가격이 계속 잠겨 있어요</summary><div class="a">계정이 아직 인증 상태가 아니라는 뜻입니다. 로그아웃 후 다시 로그인해 보시고, 같으면 <b>마이페이지 → 기업 프로필 → 재인증하기</b>로 인증을 다시 진행해 주세요. 그래도 잠겨 있으면 고객센터로 알려주세요.</div></details>
<details class="faq-item"><summary>문의를 보냈는데 답이 없어요</summary><div class="a">제조사 답변은 보통 영업일 1~3일입니다. 3일이 지나면 고객센터에 제품명과 함께 알려주세요. 저희가 제조사에 직접 확인해서 회신드립니다.</div></details>
<details class="faq-item"><summary>어떤 언어로 문의해야 하나요</summary><div class="a">베트남어·영어·한국어 모두 됩니다. 제조사가 답하기 어려운 언어면 메이크노브 팀이 중간에서 번역·소통을 돕습니다.</div></details>
<details class="faq-item"><summary>회사 정보가 바뀌었어요</summary><div class="a">회사명·등록번호·주소는 <b>마이페이지 → 기업 프로필 → 재인증하기</b>로 다시 채울 수 있습니다. 담당자 이름·연락처는 같은 화면의 <b>정보 수정</b>에서 바로 바꿉니다.</div></details>
</div>
<div class="gdoc-cta"><a class="btn btn-primary" href="support.html">고객센터로 문의하기</a></div>`,
    vi:`<h1>Chỗ hay vướng</h1>
<p class="gdoc-lead">Sắp xếp theo tình huống. Vấn đề không có ở đây, gửi về <a href="support.html">bộ phận hỗ trợ</a> — trả lời trong 2 ngày làm việc.</p>
<div class="faq-list">
<details class="faq-item"><summary>Xác thực doanh nghiệp không qua</summary><div class="a">Kiểm tra mã số có đúng không và doanh nghiệp còn hoạt động không. MST nhập số liền, không gạch ngang. Vẫn không được thì dùng <b>gửi yêu cầu nhanh</b> ở màn hình đăng ký — chúng tôi sẽ liên hệ và xác thực trực tiếp.</div></details>
<details class="faq-item"><summary>Đăng ký rồi nhưng không đăng nhập được</summary><div class="a">Phần lớn do chưa bấm email xác nhận. Kiểm tra hộp thư và mục spam. Màn hình đăng nhập có nút <b>gửi lại thư xác nhận</b>. Quên mật khẩu thì dùng liên kết đặt lại.</div></details>
<details class="faq-item"><summary>Đã đăng nhập mà giá vẫn khóa</summary><div class="a">Tài khoản chưa ở trạng thái đã xác thực. Đăng xuất rồi vào lại; nếu vẫn vậy, vào <b>Trang của tôi → Hồ sơ doanh nghiệp → Xác thực lại</b>. Vẫn khóa thì báo hỗ trợ.</div></details>
<details class="faq-item"><summary>Gửi yêu cầu mà không có hồi âm</summary><div class="a">Nhà sản xuất thường trả lời trong 1–3 ngày làm việc. Quá 3 ngày, báo hỗ trợ kèm tên sản phẩm — chúng tôi sẽ xác nhận trực tiếp với nhà sản xuất và phản hồi bạn.</div></details>
<details class="faq-item"><summary>Nên hỏi bằng ngôn ngữ nào</summary><div class="a">Tiếng Việt, Anh, Hàn đều được. Nếu nhà sản xuất khó trả lời bằng ngôn ngữ đó, đội MAKENOV sẽ dịch và hỗ trợ ở giữa.</div></details>
<details class="faq-item"><summary>Thông tin công ty thay đổi</summary><div class="a">Tên công ty, mã số, địa chỉ: <b>Trang của tôi → Hồ sơ doanh nghiệp → Xác thực lại</b>. Người phụ trách và liên hệ: nút <b>Sửa thông tin</b> cùng màn hình.</div></details>
</div>
<div class="gdoc-cta"><a class="btn btn-primary" href="support.html">Liên hệ hỗ trợ</a></div>`,
    en:`<h1>Where people get stuck</h1>
<p class="gdoc-lead">Organised by situation. Anything not covered here, send to <a href="support.html">support</a> — we reply within two business days.</p>
<div class="faq-list">
<details class="faq-item"><summary>Business verification won't pass</summary><div class="a">Check the number is correct and the business is still active. Vietnamese MST goes in as digits only, no hyphens. If it still fails, use the <b>quick enquiry</b> on the sign-up screen — we'll contact you and verify manually.</div></details>
<details class="faq-item"><summary>Signed up but can't log in</summary><div class="a">Usually the confirmation email wasn't clicked. Check inbox and spam. The login screen has a <b>resend</b> button; use the reset link if you forgot your password.</div></details>
<details class="faq-item"><summary>Logged in but prices stay locked</summary><div class="a">Your account isn't in a verified state yet. Log out and back in; if unchanged, go to <b>My page → Company profile → Re-verify</b>. Still locked? Tell support.</div></details>
<details class="faq-item"><summary>No reply to my request</summary><div class="a">Manufacturers usually answer within 1–3 business days. Past three days, tell support with the product name — we'll check with the maker directly and get back to you.</div></details>
<details class="faq-item"><summary>Which language should I write in?</summary><div class="a">Vietnamese, English and Korean all work. If the maker struggles with yours, the MAKENOV team translates and mediates.</div></details>
<details class="faq-item"><summary>My company details changed</summary><div class="a">Company name, number and address: <b>My page → Company profile → Re-verify</b>. Contact person and phone: the <b>Edit details</b> button on the same screen.</div></details>
</div>
<div class="gdoc-cta"><a class="btn btn-primary" href="support.html">Contact support</a></div>`}},
]},
];

/* ---------- 렌더 ---------- */
const GD_FLAT = GD.flatMap(g=>g.items);
let gdCur = 'welcome';

function gdSide(){
  document.getElementById('gdoc-side').innerHTML = GD.map(g=>`
    <div class="gdoc-g"><span>${g.icon}<i>${esc(L(g.label))}</i></span>
      ${g.items.map(a=>`<a href="#${a.id}" data-art="${a.id}" class="${a.id===gdCur?'on':''}">${esc(L(a.title))}</a>`).join('')}
    </div>`).join('')
    + `<div class="gdoc-g"><a href="support.html">${esc(t('nav_support'))} ↗</a></div>`;
}
function gdMain(){
  const idx = GD_FLAT.findIndex(a=>a.id===gdCur);
  const art = GD_FLAT[idx] || GD_FLAT[0];
  const grp = GD.find(g=>g.items.includes(art));
  const prev = GD_FLAT[idx-1], next = GD_FLAT[idx+1];
  document.getElementById('gdoc-main').innerHTML = `
    <div class="gdoc-crumb">${esc(L(grp.label))} › <b>${esc(L(art.title))}</b></div>
    ${L(art.body)}
    <div class="gdoc-pn">
      ${prev?`<a href="#${prev.id}" data-art="${prev.id}"><i>←</i><span>${esc(L(prev.title))}</span></a>`:'<span></span>'}
      ${next?`<a class="nx" href="#${next.id}" data-art="${next.id}"><span>${esc(L(next.title))}</span><i>→</i></a>`:'<span></span>'}
    </div>`;
}
function showArt(id){
  if(!GD_FLAT.some(a=>a.id===id)) return;
  gdCur = id;
  gdSide(); gdMain();
  window.scrollTo({top:0});
}
document.addEventListener('click', e=>{
  const a = e.target.closest('a[data-art]');
  if(!a) return;
  e.preventDefault();
  history.replaceState(null,'','#'+a.dataset.art);
  showArt(a.dataset.art);
});
function pageInit(){
  const id = location.hash.replace('#','');
  if(GD_FLAT.some(a=>a.id===id)) gdCur = id;
  gdSide(); gdMain();
}
</script>
</body>
</html>
