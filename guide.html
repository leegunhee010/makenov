<script>
/* 해시로 아티클 전환 — trevity 헬프센터와 같은 단일 페이지 문서 구조 */
function showArt(id){
  document.querySelectorAll('.gart').forEach(a=>a.hidden = a.id !== 'art-'+id);
  document.querySelectorAll('.gdoc-side a[data-art]').forEach(a=>a.classList.toggle('on', a.dataset.art===id));
  window.scrollTo({top:0});
}
document.addEventListener('click', e=>{
  const a = e.target.closest('a[data-art]');
  if(!a) return;
  e.preventDefault();
  history.replaceState(null,'','#'+a.dataset.art);
  showArt(a.dataset.art);
});
function pageInit(){
  document.getElementById('gd-title').innerHTML = esc(t('gd_title')).replace(/\n/g,'<br>');
  const id = location.hash.replace('#','');
  if(id && document.getElementById('art-'+id)) showArt(id);
}
</script>
