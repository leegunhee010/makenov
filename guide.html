  items:[
  { id:'welcome', title:{ko:'메이크노브란',vi:'MAKENOV là gì',en:'What is MAKENOV'},
    body:{
    ko:`<h1>메이크노브는<br>이런 플랫폼입니다</h1>
<p class="gdoc-lead">메이크노브는 한국 제조사의 혁신 제품을 해외 바이어와 직접 잇는 <b>B2B 도매 플랫폼</b>입니다. 소매 쇼핑몰이 아니고, 펀딩도 아닙니다 — 제품을 발견하고, 조건을 확인하고, 제조사에 견적을 요청하는 곳입니다.</p>
<h2>핵심 구조 — 가격은 인증한 바이어에게만</h2>
<p>제품 구경은 누구나 할 수 있습니다. 하지만 <b>가격 · MOQ · 납기 · 공급 조건</b> 네 가지는 사업자 인증을 통과한 계정에만 전송됩니다. 화면에서 가리는 게 아니라 서버에서 아예 보내지 않기 때문에, 제조사가 안심하고 실제 단가를 올립니다. 이게 메이크노브에 진짜 가격이 있는 이유입니다.</p>
<p>견적 문의는 중간상 없이 <b>제조사에게 직접</b> 전달됩니다. 메이크노브는 검증과 연결을 담당하고, 거래 마진을 얹지 않습니다.</p>
<h2>메뉴 한 바퀴</h2>
<table class="gdoc-table">
<tr><th>제품</th><td>전체 제품 디렉토리. 카테고리·정렬로 좁혀봅니다.</td></tr>
<tr><th>제조사</th><td>회사별 보기. 인증·연혁·그 회사의 전 제품이 한 페이지에 있습니다.</td></tr>
<tr><th>칼럼</th><td>수입 트렌드·소싱 가이드 읽을거리.</td></tr>
<tr><th>관심제품 ♥</th><td>담아둔 제품. 여기서 일괄 견적 요청을 보냅니다.</td></tr>
<tr><th>마이페이지</th><td>내 문의 상태, 기업 프로필, 재인증.</td></tr>
</table>
<h2>3개 국어</h2>
<p>사이트는 베트남어가 기본이고, 우측 상단에서 VI / KO / EN을 전환할 수 있습니다. 문의는 어느 언어로 써도 됩니다 — 필요하면 메이크노브 팀이 중간에서 번역을 돕습니다.</p>
<div class="gdoc-cards">
<a href="#signup" data-art="signup"><h3>가입과 사업자 인증</h3><p>1분이면 끝나는 무료 인증 — 여기서 시작하세요</p></a>
<a href="#find" data-art="find"><h3>제품 찾기</h3><p>카테고리 · 검색 · 제조사별 — 세 가지 길</p></a>
</div>`,
    vi:`<h1>MAKENOV là<br>nền tảng như thế nào</h1>
<p class="gdoc-lead">MAKENOV là <b>nền tảng B2B bán sỉ</b> kết nối trực tiếp sản phẩm sáng tạo của nhà sản xuất Hàn Quốc với nhà mua quốc tế. Không phải shop bán lẻ, không phải gọi vốn — đây là nơi khám phá sản phẩm, xem điều kiện và gửi yêu cầu báo giá thẳng tới nhà sản xuất.</p>
<h2>Cấu trúc cốt lõi — giá chỉ mở cho người đã xác thực</h2>
<p>Ai cũng xem được sản phẩm. Nhưng bốn thứ — <b>giá · MOQ · thời gian giao · điều kiện cung ứng</b> — chỉ được gửi tới tài khoản đã qua xác thực doanh nghiệp. Không phải che trên màn hình mà máy chủ hoàn toàn không gửi ra, nên nhà sản xuất yên tâm đăng đơn giá thật. Đó là lý do MAKENOV có giá thật.</p>
<p>Yêu cầu báo giá đến <b>thẳng nhà sản xuất</b>, không qua trung gian. MAKENOV lo phần xác thực và kết nối, không cộng thêm chênh lệch.</p>
<h2>Một vòng các menu</h2>
<table class="gdoc-table">
<tr><th>Sản phẩm</th><td>Danh mục toàn bộ sản phẩm, lọc theo ngành hàng và sắp xếp.</td></tr>
<tr><th>Nhà sản xuất</th><td>Xem theo công ty — chứng nhận, lịch sử và toàn bộ sản phẩm trên một trang.</td></tr>
<tr><th>Bài viết</th><td>Xu hướng nhập khẩu và hướng dẫn sourcing.</td></tr>
<tr><th>Quan tâm ♥</th><td>Sản phẩm đã lưu — gửi yêu cầu báo giá hàng loạt từ đây.</td></tr>
<tr><th>Trang của tôi</th><td>Trạng thái yêu cầu, hồ sơ doanh nghiệp, xác thực lại.</td></tr>
</table>
<h2>Ba ngôn ngữ</h2>
<p>Mặc định là tiếng Việt; chuyển VI / KO / EN ở góc phải trên. Yêu cầu báo giá viết bằng ngôn ngữ nào cũng được — khi cần, đội MAKENOV hỗ trợ dịch.</p>
<div class="gdoc-cards">
<a href="#signup" data-art="signup"><h3>Đăng ký & xác thực</h3><p>Xác thực miễn phí trong một phút — bắt đầu từ đây</p></a>
<a href="#find" data-art="find"><h3>Tìm sản phẩm</h3><p>Ngành hàng · tìm kiếm · theo nhà sản xuất — ba con đường</p></a>
</div>`,
    en:`<h1>What MAKENOV is</h1>
<p class="gdoc-lead">MAKENOV is a <b>wholesale B2B platform</b> connecting innovative Korean manufacturers directly with international buyers. Not a retail shop, not crowdfunding — a place to discover products, check terms and request quotes straight from the maker.</p>
<h2>The core structure — prices open only to the verified</h2>
<p>Anyone can browse products. But four things — <b>price · MOQ · lead time · supply terms</b> — are sent only to accounts that pass business verification. They're not hidden on screen; the server simply never sends them. That's why manufacturers are comfortable listing real prices here.</p>
<p>Quotation requests go <b>straight to the manufacturer</b>, no middleman. MAKENOV handles verification and matching, and adds no margin.</p>
<h2>A lap around the menus</h2>
<table class="gdoc-table">
<tr><th>Products</th><td>The full directory — narrow by category and sort.</td></tr>
<tr><th>Manufacturers</th><td>Browse by company — certifications, history and their full lineup on one page.</td></tr>
<tr><th>Articles</th><td>Import trends and sourcing guides.</td></tr>
<tr><th>Wishlist ♥</th><td>Saved products — send bulk quote requests from here.</td></tr>
<tr><th>My page</th><td>Request status, company profile, re-verification.</td></tr>
</table>
<h2>Three languages</h2>
<p>Vietnamese by default; switch VI / KO / EN top right. Write requests in any of the three — the MAKENOV team helps translate when needed.</p>
<div class="gdoc-cards">
<a href="#signup" data-art="signup"><h3>Sign-up & verification</h3><p>Free, done in about a minute — start here</p></a>
<a href="#find" data-art="find"><h3>Finding products</h3><p>Category · search · by manufacturer — three routes</p></a>
</div>`}},
  { id:'signup', title:{ko:'가입과 사업자 인증',vi:'Đăng ký & xác thực',en:'Sign-up & verification'},
    body:{
    ko:`<h1>가입과 사업자 인증</h1>
<p class="gdoc-lead">가격을 보려면 사업자 인증이 필요합니다. 무료이고, 보통 1분이면 끝납니다.</p>
<h2>국가별 인증 방법</h2>
<table class="gdoc-table">
<tr><th>베트남</th><td>세금코드(MST)를 숫자만 입력 → 자동 조회되어 회사명·주소가 채워집니다.</td></tr>
<tr><th>한국</th><td>사업자등록번호 입력 → 국세청에서 계속사업자 여부를 확인합니다.</td></tr>
<tr><th>그 외 국가</th><td>회사 이메일 도메인으로 인증. Gmail 등 무료 메일은 사용할 수 없습니다.</td></tr>
</table>
<h2>절차</h2>
<ol class="gdoc-ol">
<li>우측 상단 <b>회원가입</b> → 국가 선택</li>
<li>사업자 번호(또는 회사 이메일) 인증 — 실패하면 화면의 <b>간편 문의</b>로 넘어가세요. 담당자가 연락드려 직접 인증을 도와드립니다</li>
<li>담당자 이름·연락처·비밀번호 입력 → 완료</li>
<li>확인 메일의 링크를 누르면 로그인됩니다</li>
</ol>
<div class="gdoc-note">인증 즉시 모든 제품의 가격·MOQ·납기·공급 조건이 열리고, 견적 문의에 회사 정보가 자동으로 실립니다. 정보가 바뀌면 <b>마이페이지 → 기업 프로필 → 재인증하기</b>로 다시 채우세요.</div>`,
    vi:`<h1>Đăng ký & xác thực doanh nghiệp</h1>
<p class="gdoc-lead">Muốn xem giá cần xác thực doanh nghiệp. Miễn phí và thường chỉ mất một phút.</p>
<h2>Cách xác thực theo quốc gia</h2>
<table class="gdoc-table">
<tr><th>Việt Nam</th><td>Nhập mã số thuế (MST), chỉ số không gạch → tra cứu tự động, tên và địa chỉ công ty tự điền.</td></tr>
<tr><th>Hàn Quốc</th><td>Nhập số đăng ký kinh doanh → đối chiếu với cơ quan thuế.</td></tr>
<tr><th>Quốc gia khác</th><td>Xác thực bằng email tên miền công ty. Không dùng được Gmail hay email miễn phí.</td></tr>
</table>
<h2>Các bước</h2>
<ol class="gdoc-ol">
<li>Bấm <b>Đăng ký</b> góc phải trên → chọn quốc gia</li>
<li>Xác thực mã số (hoặc email công ty) — nếu thất bại, dùng <b>gửi yêu cầu nhanh</b> trên màn hình, chúng tôi sẽ liên hệ và xác thực trực tiếp</li>
<li>Nhập tên người phụ trách, liên hệ, mật khẩu → hoàn tất</li>
<li>Bấm liên kết trong email xác nhận để đăng nhập</li>
</ol>
<div class="gdoc-note">Ngay khi xác thực, giá · MOQ · thời gian giao · điều kiện của mọi sản phẩm đều mở, và yêu cầu báo giá tự động kèm thông tin công ty bạn. Thông tin thay đổi? Vào <b>Trang của tôi → Hồ sơ doanh nghiệp → Xác thực lại</b>.</div>`,
    en:`<h1>Sign-up & business verification</h1>
<p class="gdoc-lead">Seeing prices requires business verification. It's free and usually takes about a minute.</p>
<h2>How each country verifies</h2>
<table class="gdoc-table">
<tr><th>Vietnam</th><td>Enter your tax code (MST), digits only → auto-lookup fills company name and address.</td></tr>
<tr><th>Korea</th><td>Enter the business registration number → status checked with the tax office.</td></tr>
<tr><th>Elsewhere</th><td>Verify by company email domain. Gmail and other free providers are not accepted.</td></tr>
</table>
<h2>Steps</h2>
<ol class="gdoc-ol">
<li>Click <b>Sign up</b> top right → choose your country</li>
<li>Verify your number (or company email) — if it fails, use the on-screen <b>quick enquiry</b> and we'll verify you manually</li>
<li>Enter contact name, phone and password → done</li>
<li>Click the link in the confirmation email to log in</li>
</ol>
<div class="gdoc-note">The moment you verify, price · MOQ · lead time · terms unlock on every product, and your requests carry your company details automatically. Details changed? <b>My page → Company profile → Re-verify</b>.</div>`}},
]},

{ label:{ko:'바이어 이용법',vi:'Dành cho nhà mua',en:'For buyers'},
  icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.9-3.6 4-5.6 7.5-5.6s6.6 2 7.5 5.6"/></svg>',
  items:[
  { id:'find', title:{ko:'제품 찾기',vi:'Tìm sản phẩm',en:'Finding products'},
    body:{
    ko:`<h1>제품 찾는 세 가지 길</h1>
<h2>1 · 카테고리로</h2>
<p>홈 왼쪽의 <b>카테고리 레일</b>에 제품이 있는 카테고리와 개수가 떠 있습니다. 클릭하면 그 카테고리만 모인 디렉토리로 이동합니다. 디렉토리 안에서도 상단 칩으로 카테고리를 바꾸고, <b>신규순</b> 정렬로 최근 등록 제품부터 볼 수 있습니다.</p>
<h2>2 · 검색으로</h2>
<p>헤더 가운데 검색창에 제품명이나 브랜드를 넣으세요. 예: "PDRN", "풋크림", "MIRALET". 세 언어 어느 쪽으로 검색해도 됩니다.</p>
<h2>3 · 제조사로</h2>
<p>메뉴의 <b>제조사</b>는 회사 단위로 봅니다. 회사 페이지에는 설립연도·보유 인증·납품 실적과 그 회사의 전 제품이 있어서, 한 회사가 마음에 들면 라인업 전체를 훑기 좋습니다. 제품 상세의 회사 카드에서도 바로 이동합니다.</p>
<h2>제품 카드 읽는 법</h2>
<ul class="gdoc-ul">
<li><b>민트색 숫자</b> = 이 제품에 들어온 견적 문의 수. 시장 반응의 힌트입니다</li>
<li><b>신제품 등록 / FEATURED</b> 배지 = 최근 등록 / 추천 제품</li>
<li><b>♡ 하트</b> = 관심제품 담기 (다음 장에서 설명)</li>
<li>우측 하단 = 원산지 (예: Daegu, Korea)</li>
</ul>
<h2>상세페이지 구성</h2>
<p>왼쪽은 갤러리·영상·상세 설명·브랜드 소개, 오른쪽 고정 박스에 <b>가격 4행(인증 후 열람)과 버튼 3개</b> — 견적 문의 · 관심제품 담기 · 카탈로그 — 가 있습니다. 스크롤해도 박스는 따라오니 언제든 문의할 수 있습니다.</p>`,
    vi:`<h1>Ba con đường tìm sản phẩm</h1>
<h2>1 · Theo ngành hàng</h2>
<p><b>Thanh ngành hàng</b> bên trái trang chủ hiển thị các ngành có sản phẩm kèm số lượng. Bấm vào để tới danh mục của riêng ngành đó. Trong danh mục, đổi ngành bằng các chip phía trên và sắp xếp <b>mới nhất</b> để xem sản phẩm vừa đăng.</p>
<h2>2 · Tìm kiếm</h2>
<p>Gõ tên sản phẩm hoặc thương hiệu vào ô tìm kiếm giữa header. Ví dụ: "PDRN", "kem gót chân", "MIRALET". Tìm bằng ngôn ngữ nào trong ba thứ tiếng cũng được.</p>
<h2>3 · Theo nhà sản xuất</h2>
<p>Menu <b>Nhà sản xuất</b> xem theo công ty. Trang công ty có năm thành lập, chứng nhận, thành tích cung ứng và toàn bộ sản phẩm — ưng một công ty thì duyệt cả lineup rất tiện. Thẻ công ty trong trang chi tiết sản phẩm cũng dẫn thẳng tới đây.</p>
<h2>Đọc thẻ sản phẩm</h2>
<ul class="gdoc-ul">
<li><b>Số màu mint</b> = số yêu cầu báo giá của sản phẩm — gợi ý về phản ứng thị trường</li>
<li>Nhãn <b>Sản phẩm mới / FEATURED</b> = vừa đăng / được đề cử</li>
<li><b>♡ Trái tim</b> = lưu vào quan tâm (bài sau nói kỹ)</li>
<li>Góc phải dưới = xuất xứ (ví dụ: Daegu, Korea)</li>
</ul>
<h2>Bố cục trang chi tiết</h2>
<p>Bên trái là thư viện ảnh, video, mô tả chi tiết, giới thiệu thương hiệu; hộp cố định bên phải có <b>4 dòng điều kiện (mở sau xác thực) và 3 nút</b> — Gửi yêu cầu báo giá · Thêm quan tâm · Catalogue. Hộp bám theo khi cuộn nên lúc nào cũng gửi yêu cầu được.</p>`,
    en:`<h1>Three ways to find products</h1>
<h2>1 · By category</h2>
<p>The <b>category rail</b> on the home page lists categories that have products, with counts. Click one for a filtered directory. Inside, switch categories with the chips on top and sort by <b>newest</b> to see recent listings first.</p>
<h2>2 · By search</h2>
<p>Type a product or brand into the header search — e.g. "PDRN", "foot cream", "MIRALET". Any of the three languages works.</p>
<h2>3 · By manufacturer</h2>
<p>The <b>Manufacturers</b> menu browses by company. A company page shows founding year, certifications, supply record and the full lineup — handy when you like one maker and want to sweep everything they offer. The company card on any product page links there too.</p>
<h2>Reading a product card</h2>
<ul class="gdoc-ul">
<li><b>Mint number</b> = quotation requests on this product — a hint of market interest</li>
<li><b>New / FEATURED</b> badges = recently listed / editor's pick</li>
<li><b>♡ Heart</b> = save to wishlist (next article)</li>
<li>Bottom right = origin (e.g. Daegu, Korea)</li>
</ul>
<h2>The product page</h2>
<p>Left side: gallery, video, detailed description, brand story. The sticky box on the right holds the <b>four locked terms and three buttons</b> — Request a quote · Save · Catalogue. It follows as you scroll, so you can enquire any time.</p>`}},
  { id:'pricing', title:{ko:'가격·MOQ 보는 법',vi:'Đọc giá & MOQ',en:'Reading price & MOQ'},
    body:{
    ko:`<h1>가격·MOQ 보는 법</h1>
<p class="gdoc-lead">인증 전에는 "인증 후 열람"으로 잠겨 있던 네 줄이, 인증하면 이렇게 열립니다.</p>
<table class="gdoc-table">
<tr><th>가격</th><td>대부분 <b>FOB 기준 USD</b> — 한국 선적항까지의 가격이고, 해상운임·보험·수입 관세와 부가세는 별도입니다. 총 수입원가는 대략 FOB가 + 운임 + (관세율 × 과세가격)으로 잡으세요.</td></tr>
<tr><th>MOQ</th><td>최소주문수량. <b>협의 가능</b> 배지가 붙어 있으면 소량 테스트 오더에 열려 있다는 뜻입니다.</td></tr>
<tr><th>납기</th><td>발주 확정 후 선적까지. "문의"면 물량에 따라 달라진다는 의미입니다.</td></tr>
<tr><th>공급 조건</th><td>OEM/ODM 가능 여부, 보유 인증, 참고 소매가 같은 부가 정보.</td></tr>
</table>
<div class="gdoc-note">가격이 "문의"인 제품은 제조사가 물량·조건별로 견적을 내는 경우입니다. 그냥 견적 문의를 보내면 됩니다. 무역 용어가 낯설면 부록의 <a href="#glossary" data-art="glossary">용어 사전</a>을 먼저 보세요.</div>`,
    vi:`<h1>Đọc giá & MOQ thế nào</h1>
<p class="gdoc-lead">Bốn dòng khóa "xem sau khi xác thực" sẽ mở ra thế này sau khi bạn xác thực.</p>
<table class="gdoc-table">
<tr><th>Giá</th><td>Phần lớn là <b>USD theo FOB</b> — giá đến cảng xuất Hàn Quốc; cước biển, bảo hiểm, thuế nhập và VAT tính riêng. Ước giá vốn ≈ FOB + cước + (thuế suất × trị giá tính thuế).</td></tr>
<tr><th>MOQ</th><td>Số lượng tối thiểu. Nhãn <b>Có thể thương lượng</b> nghĩa là sẵn sàng nhận đơn thử nhỏ.</td></tr>
<tr><th>Giao hàng</th><td>Từ chốt đơn đến xuất hàng. Ghi "liên hệ" nghĩa là tùy số lượng.</td></tr>
<tr><th>Điều kiện</th><td>OEM/ODM, chứng nhận, giá lẻ tham khảo và thông tin bổ sung.</td></tr>
</table>
<div class="gdoc-note">Sản phẩm ghi giá "liên hệ" là nhà sản xuất báo giá theo số lượng và điều kiện — cứ gửi yêu cầu bình thường. Chưa quen thuật ngữ? Xem <a href="#glossary" data-art="glossary">từ điển thuật ngữ</a> ở phụ lục.</div>`,
    en:`<h1>Reading price & MOQ</h1>
<p class="gdoc-lead">The four locked lines open like this once you're verified.</p>
<table class="gdoc-table">
<tr><th>Price</th><td>Mostly <b>USD on FOB terms</b> — up to the Korean export port; freight, insurance, duty and VAT are separate. Rough landed cost ≈ FOB + freight + (duty rate × customs value).</td></tr>
<tr><th>MOQ</th><td>Minimum order quantity. A <b>Negotiable</b> badge means small trial orders are welcome.</td></tr>
<tr><th>Lead time</th><td>Confirmed order to shipment. "On request" means it depends on volume.</td></tr>
<tr><th>Terms</th><td>OEM/ODM availability, certifications, reference retail price and extras.</td></tr>
</table>
<div class="gdoc-note">Products priced "on request" are quoted by volume and terms — just send a request. New to the vocabulary? Start with the <a href="#glossary" data-art="glossary">glossary</a> in the appendix.</div>`}},
  { id:'wish', title:{ko:'관심제품과 일괄 견적',vi:'Quan tâm & báo giá hàng loạt',en:'Wishlist & bulk quotes'},
    body:{
    ko:`<h1>관심제품과 일괄 견적</h1>
<p class="gdoc-lead">제품 카드나 상세페이지의 <b>♡ 하트</b>를 누르면 관심제품에 담깁니다. 로그인해야 저장되고, 헤더의 하트 아이콘에 담긴 개수가 표시됩니다.</p>
<h2>일괄 견적 요청 — 이 기능이 핵심입니다</h2>
<p><b>마이페이지 → 관심제품</b>에 담긴 제품들이 모여 있습니다. 상단의 <b>일괄 견적 요청</b>을 누르면 담긴 제품 전체가 <b>한 번에</b> 문의됩니다 — 제품 수만큼 문의가 만들어져 각 제조사에 따로 전달되므로, 제조사마다 반복 입력할 필요가 없습니다.</p>
<h2>이렇게 활용하세요</h2>
<ul class="gdoc-ul">
<li><b>비교 소싱</b> — 비슷한 제품 3~4개를 담아 일괄 문의하면 조건을 나란히 비교할 수 있습니다</li>
<li><b>천천히 모으기</b> — 담아둔 목록은 계정에 저장되므로, 며칠에 걸쳐 모았다가 한 번에 보내도 됩니다</li>
<li>개별 제품만 문의하려면 관심제품 목록의 각 항목에 있는 <b>견적 문의</b> 버튼을 쓰세요</li>
</ul>
<div class="gdoc-note">하트를 눌렀는데 담기지 않으면 로그인 상태를 먼저 확인하세요. 저장에 실패하면 화면에 안내가 뜹니다 — 그래도 이상하면 <a href="support.html">고객센터</a>로 알려주세요.</div>`,
    vi:`<h1>Quan tâm & báo giá hàng loạt</h1>
<p class="gdoc-lead">Bấm <b>♡ trái tim</b> trên thẻ hoặc trang chi tiết để lưu sản phẩm. Cần đăng nhập để lưu; số lượng đã lưu hiện trên biểu tượng trái tim ở header.</p>
<h2>Yêu cầu báo giá hàng loạt — tính năng cốt lõi</h2>
<p>Sản phẩm đã lưu nằm ở <b>Trang của tôi → Quan tâm</b>. Bấm <b>Gửi yêu cầu hàng loạt</b> phía trên — toàn bộ sản phẩm đã lưu được hỏi <b>trong một lần</b>: mỗi sản phẩm sinh một yêu cầu gửi tới đúng nhà sản xuất của nó, không phải nhập lại từng nơi.</p>
<h2>Dùng thế nào cho hiệu quả</h2>
<ul class="gdoc-ul">
<li><b>Sourcing so sánh</b> — lưu 3–4 sản phẩm tương tự rồi hỏi một lượt để so điều kiện cạnh nhau</li>
<li><b>Gom từ từ</b> — danh sách lưu theo tài khoản, gom vài ngày rồi gửi một lần cũng được</li>
<li>Muốn hỏi riêng một sản phẩm, dùng nút <b>Gửi yêu cầu báo giá</b> ở từng dòng</li>
</ul>
<div class="gdoc-note">Bấm tim mà không lưu được? Kiểm tra đã đăng nhập chưa. Nếu lưu thất bại sẽ có thông báo trên màn hình — vẫn lạ thì báo <a href="support.html">bộ phận hỗ trợ</a>.</div>`,
    en:`<h1>Wishlist & bulk quotes</h1>
<p class="gdoc-lead">Tap the <b>♡ heart</b> on any card or product page to save it. Saving requires login; the header heart shows how many you've saved.</p>
<h2>Bulk quote requests — the key feature</h2>
<p>Saved products live under <b>My page → Wishlist</b>. Hit <b>bulk request</b> at the top and every saved product is enquired <b>in one go</b> — one request per product, each routed to its own manufacturer, so you never re-type per maker.</p>
<h2>How to use it well</h2>
<ul class="gdoc-ul">
<li><b>Comparison sourcing</b> — save 3–4 similar products and request together to compare terms side by side</li>
<li><b>Collect over time</b> — the list is saved to your account; gather for days, send once</li>
<li>For a single product, use the <b>Request a quote</b> button on its row</li>
</ul>
<div class="gdoc-note">Heart not saving? Check you're logged in. Failed saves show a message on screen — if it still looks wrong, tell <a href="support.html">support</a>.</div>`}},
  { id:'inquiry', title:{ko:'견적 문의와 상태 확인',vi:'Yêu cầu báo giá & trạng thái',en:'Requests & status'},
    body:{
    ko:`<h1>견적 문의와 상태 확인</h1>
<p class="gdoc-lead">문의는 제조사에 그대로 전달됩니다. 처음 한 통에 아래가 들어 있으면 왕복 두세 번을 아낍니다.</p>
<h2>보내기 전에 적을 것</h2>
<ul class="gdoc-ul">
<li><b>희망 수량</b> — "MOQ가 높으면 첫 주문은 500개로 시작하고 싶다"처럼 계획을 함께</li>
<li><b>필요 시기</b> — 판매 시즌이 있다면 언제까지 받아야 하는지</li>
<li><b>판매 채널</b> — 약국·화장품 매장·온라인 등. 제조사가 조건을 맞추는 데 중요합니다</li>
<li><b>요청 서류</b> — 성분표, C/O, 시험성적서 등</li>
</ul>
<h2>보낸 뒤 — 상태 배지</h2>
<table class="gdoc-table">
<tr><th>접수됨</th><td>문의가 제조사에 전달된 상태.</td></tr>
<tr><th>처리 중</th><td>제조사·메이크노브가 확인하고 있는 상태.</td></tr>
<tr><th>답변 완료</th><td>답변이 나간 상태 — 가입 시 남긴 이메일·연락처를 확인하세요.</td></tr>
</table>
<p>상태는 <b>마이페이지 → 내 문의</b>에서 봅니다. 영업일 3일이 지나도 소식이 없으면 <a href="support.html">고객센터</a>에 제품명과 함께 알려주세요 — 저희가 제조사에 직접 확인합니다.</p>
<div class="gdoc-note">문의는 어느 언어로 써도 됩니다. 제조사가 어려워하는 언어면 메이크노브 팀이 번역을 돕습니다.</div>`,
    vi:`<h1>Yêu cầu báo giá & theo dõi trạng thái</h1>
<p class="gdoc-lead">Yêu cầu được chuyển nguyên văn tới nhà sản xuất. Bức đầu tiên đủ ý sẽ tiết kiệm vài lượt hỏi đáp.</p>
<h2>Nên ghi trước khi gửi</h2>
<ul class="gdoc-ul">
<li><b>Số lượng mong muốn</b> — kèm kế hoạch, ví dụ "MOQ cao thì đơn đầu 500 cái"</li>
<li><b>Thời điểm cần hàng</b> — nếu bán theo mùa, cần trước ngày nào</li>
<li><b>Kênh bán</b> — nhà thuốc, cửa hàng mỹ phẩm, online…</li>
<li><b>Giấy tờ cần</b> — bảng thành phần, C/O, phiếu kiểm nghiệm…</li>
</ul>
<h2>Sau khi gửi — nhãn trạng thái</h2>
<table class="gdoc-table">
<tr><th>Đã tiếp nhận</th><td>Yêu cầu đã chuyển tới nhà sản xuất.</td></tr>
<tr><th>Đang xử lý</th><td>Nhà sản xuất / MAKENOV đang xem.</td></tr>
<tr><th>Đã trả lời</th><td>Đã gửi câu trả lời — kiểm tra email/số liên hệ bạn đăng ký.</td></tr>
</table>
<p>Xem trạng thái tại <b>Trang của tôi → Yêu cầu của tôi</b>. Quá 3 ngày làm việc chưa có tin, báo <a href="support.html">hỗ trợ</a> kèm tên sản phẩm — chúng tôi xác nhận trực tiếp với nhà sản xuất.</p>
<div class="gdoc-note">Viết bằng ngôn ngữ nào cũng được. Nhà sản xuất khó trả lời bằng tiếng đó thì đội MAKENOV hỗ trợ dịch.</div>`,
    en:`<h1>Requests & tracking status</h1>
<p class="gdoc-lead">Your request reaches the manufacturer as-is. A complete first message saves several round trips.</p>
<h2>Include before sending</h2>
<ul class="gdoc-ul">
<li><b>Target quantity</b> — with your plan, e.g. "if the MOQ is high, we'd start at 500 units"</li>
<li><b>When you need it</b> — especially for seasonal sales</li>
<li><b>Sales channel</b> — pharmacy, cosmetics stores, online…</li>
<li><b>Documents needed</b> — ingredients, C/O, test reports…</li>
</ul>
<h2>After sending — the status badges</h2>
<table class="gdoc-table">
<tr><th>Received</th><td>Forwarded to the manufacturer.</td></tr>
<tr><th>In progress</th><td>Being reviewed by the maker / MAKENOV.</td></tr>
<tr><th>Answered</th><td>A reply went out — check the email/phone you registered.</td></tr>
</table>
<p>Track it under <b>My page → My inquiries</b>. Past three business days with no news, tell <a href="support.html">support</a> with the product name — we check with the maker directly.</p>
<div class="gdoc-note">Any language works. If the maker struggles with yours, the MAKENOV team translates.</div>`}},
  { id:'mypage', title:{ko:'마이페이지 활용',vi:'Trang của tôi',en:'Using My page'},
    body:{
    ko:`<h1>마이페이지 활용</h1>
<p class="gdoc-lead">헤더 우측의 관심제품·계정 아이콘으로 들어갑니다. 탭 세 개가 전부입니다.</p>
<table class="gdoc-table">
<tr><th>관심제품</th><td>하트로 담은 제품 목록. 개별 견적 문의, 일괄 견적 요청, 삭제.</td></tr>
<tr><th>내 문의</th><td>보낸 견적 문의와 처리 상태(접수됨 / 처리 중 / 답변 완료).</td></tr>
<tr><th>기업 프로필</th><td>기업 정보와 담당자 정보 두 카드.</td></tr>
</table>
<h2>기업 프로필에서 할 수 있는 것</h2>
<ul class="gdoc-ul">
<li><b>재인증하기</b> — 회사명·등록번호·주소는 인증으로 채워지는 값입니다. 이전했거나 정보가 비어 있으면 이 버튼으로 다시 인증하세요</li>
<li><b>정보 수정</b> — 담당자 이름·직함·전화번호는 바로 고칠 수 있습니다. 문의 답변이 이 연락처로 오니 최신으로 유지하세요</li>
</ul>
<div class="gdoc-note">상단 요약에 <b>인증된 사업자</b> 배지가 보이면 가격 열람이 열려 있는 정상 상태입니다. VIP 배지는 운영팀이 우수 바이어에게 부여합니다.</div>`,
    vi:`<h1>Dùng Trang của tôi</h1>
<p class="gdoc-lead">Vào bằng biểu tượng quan tâm / tài khoản góc phải header. Chỉ có ba tab.</p>
<table class="gdoc-table">
<tr><th>Quan tâm</th><td>Sản phẩm đã lưu — hỏi riêng, hỏi hàng loạt, xóa.</td></tr>
<tr><th>Yêu cầu của tôi</th><td>Các yêu cầu đã gửi và trạng thái (Đã tiếp nhận / Đang xử lý / Đã trả lời).</td></tr>
<tr><th>Hồ sơ doanh nghiệp</th><td>Hai thẻ: thông tin doanh nghiệp và người phụ trách.</td></tr>
</table>
<h2>Trong hồ sơ doanh nghiệp</h2>
<ul class="gdoc-ul">
<li><b>Xác thực lại</b> — tên công ty, mã số, địa chỉ được điền qua xác thực. Chuyển trụ sở hoặc hồ sơ trống thì bấm nút này để xác thực lại</li>
<li><b>Sửa thông tin</b> — tên, chức danh, số điện thoại người phụ trách sửa ngay được. Câu trả lời báo giá gửi về liên hệ này, hãy giữ cho mới</li>
</ul>
<div class="gdoc-note">Thấy nhãn <b>Doanh nghiệp đã xác thực</b> ở phần tóm tắt nghĩa là quyền xem giá đang mở bình thường. Nhãn VIP do đội vận hành trao cho nhà mua tốt.</div>`,
    en:`<h1>Using My page</h1>
<p class="gdoc-lead">Enter via the wishlist/account icons top right. Three tabs is all there is.</p>
<table class="gdoc-table">
<tr><th>Wishlist</th><td>Saved products — enquire singly, in bulk, or remove.</td></tr>
<tr><th>My inquiries</th><td>Sent requests and their status (Received / In progress / Answered).</td></tr>
<tr><th>Company profile</th><td>Two cards: company info and contact person.</td></tr>
</table>
<h2>What the profile lets you do</h2>
<ul class="gdoc-ul">
<li><b>Re-verify</b> — company name, number and address are filled by verification. Moved, or fields empty? This button re-runs it</li>
<li><b>Edit details</b> — contact name, title and phone are editable right there. Quote replies come to these details, so keep them current</li>
</ul>
<div class="gdoc-note">Seeing the <b>Verified business</b> badge in the summary means price access is active and healthy. The VIP badge is granted by our team to standout buyers.</div>`}},
]},

{ label:{ko:'제조사 이용법',vi:'Dành cho nhà sản xuất',en:'For manufacturers'},
  icon:'<svg viewBox="0 0 24 24"><path d="M3 20V11l5 3V11l5 3V6l8 5v9z"/><path d="M3 20h18"/></svg>',
  items:[
  { id:'m-listing', title:{ko:'제품 등록 절차',vi:'Quy trình đăng sản phẩm',en:'Listing process'},
    body:{
    ko:`<h1>제품 등록 절차</h1>
<p class="gdoc-lead">제조사가 할 일은 자료를 주는 것까지입니다. 번역, 3개 국어 상세페이지 제작, 기업 프로필 구성, 광고 노출은 메이크노브가 합니다. 등록비는 없습니다.</p>
<ol class="gdoc-ol big">
<li><b>등록 문의</b> — <a href="maker.html">제품 등록 문의</a> 양식에 회사와 제품만 남겨주세요. 5분이면 충분합니다. 영업일 2일 이내에 연락드립니다.</li>
<li><b>자료 전달</b> — 제품 사진, 규격, 수출 단가(FOB), MOQ를 보내주세요. 기존 카탈로그 PDF·상세페이지가 있으면 그대로 주셔도 됩니다. 상세 목록은 <a href="#m-materials" data-art="m-materials">준비 자료 체크리스트</a>에 있습니다.</li>
<li><b>3개 국어 등록</b> — 베트남어·영어·한국어 상세페이지와 기업 프로필을 만들어 게시합니다. 자료가 다 모인 뒤 통상 영업일 5일 이내이고, 게시 전에 확인을 받습니다.</li>
<li><b>문의 수신</b> — 인증 바이어의 견적 문의가 회사명·담당자·연락처와 함께 이메일로 전달됩니다. 답변은 제조사가 직접, 소통이 어려우면 메이크노브가 돕습니다.</li>
</ol>
<h2>자주 묻는 것</h2>
<ul class="gdoc-ul">
<li><b>단가가 노출되지 않나요?</b> — 가격·MOQ는 인증 바이어에게만 전송됩니다. 비로그인 화면과 검색엔진에는 아예 실리지 않습니다.</li>
<li><b>독점인가요?</b> — 아닙니다. 다른 플랫폼에 올라가 있어도 됩니다.</li>
<li><b>수출 경험이 없어도 되나요?</b> — 됩니다. 단, 수출 단가와 MOQ는 정해두셔야 합니다. 바이어가 가장 먼저 묻는 두 가지입니다.</li>
</ul>`,
    vi:`<h1>Quy trình đăng sản phẩm</h1>
<p class="gdoc-lead">Nhà sản xuất chỉ cần cung cấp tư liệu. Dịch thuật, trang chi tiết ba ngôn ngữ, hồ sơ công ty và quảng bá do MAKENOV đảm nhận. Không thu phí đăng.</p>
<ol class="gdoc-ol big">
<li><b>Gửi yêu cầu đăng</b> — điền công ty và sản phẩm vào <a href="maker.html">biểu mẫu</a>. Khoảng 5 phút; chúng tôi liên hệ trong 2 ngày làm việc.</li>
<li><b>Gửi tư liệu</b> — ảnh sản phẩm, quy cách, giá FOB, MOQ. Có catalogue PDF sẵn thì gửi nguyên bản. Danh sách đầy đủ ở <a href="#m-materials" data-art="m-materials">checklist tư liệu</a>.</li>
<li><b>Đăng bằng 3 ngôn ngữ</b> — trang chi tiết và hồ sơ công ty bằng tiếng Việt, Hàn, Anh; thường trong 5 ngày làm việc từ khi đủ tư liệu, duyệt trước khi đăng.</li>
<li><b>Nhận yêu cầu</b> — yêu cầu của nhà mua đã xác thực gửi về email kèm tên công ty, người phụ trách, liên hệ. Trả lời trực tiếp; khó trao đổi thì MAKENOV hỗ trợ.</li>
</ol>
<h2>Hay được hỏi</h2>
<ul class="gdoc-ul">
<li><b>Đơn giá có lộ không?</b> — Giá và MOQ chỉ gửi cho nhà mua đã xác thực; màn hình chưa đăng nhập và công cụ tìm kiếm hoàn toàn không thấy.</li>
<li><b>Có độc quyền không?</b> — Không. Đang ở nền tảng khác vẫn đăng được.</li>
<li><b>Chưa từng xuất khẩu?</b> — Không sao, nhưng cần chốt sẵn giá xuất và MOQ — hai điều nhà mua hỏi đầu tiên.</li>
</ul>`,
    en:`<h1>Listing process</h1>
<p class="gdoc-lead">Your job ends at handing over materials. Translation, three-language pages, the company profile and promotion are on MAKENOV. No listing fee.</p>
<ol class="gdoc-ol big">
<li><b>Send a request</b> — fill in company and product on the <a href="maker.html">form</a>. About five minutes; we reply within two business days.</li>
<li><b>Send materials</b> — photos, specs, FOB price, MOQ. An existing catalogue PDF is fine as-is. Full list in the <a href="#m-materials" data-art="m-materials">checklist</a>.</li>
<li><b>We publish in three languages</b> — Vietnamese, Korean, English pages plus a company profile, usually within five business days of complete materials; you approve first.</li>
<li><b>Receive requests</b> — verified buyers' requests arrive by email with company, contact and details. You reply directly; MAKENOV helps when needed.</li>
</ol>
<h2>Common questions</h2>
<ul class="gdoc-ul">
<li><b>Will pricing leak?</b> — Price and MOQ go only to verified buyers; logged-out pages and search engines never carry them.</li>
<li><b>Exclusive?</b> — No. Other platforms are fine.</li>
<li><b>No export record?</b> — Fine, but fix your export price and MOQ first — buyers ask those immediately.</li>
</ul>`}},
  { id:'m-materials', title:{ko:'준비 자료 체크리스트',vi:'Checklist tư liệu',en:'Materials checklist'},
    body:{
    ko:`<h1>준비 자료 체크리스트</h1>
<p class="gdoc-lead">이 목록대로 보내주시면 등록이 한 번에 끝납니다. 전부 있어야 시작하는 건 아니고, <b>필수</b> 네 가지가 핵심입니다.</p>
<table class="gdoc-table">
<tr><th>대표 사진 <i>필수</i></th><td>제품 단독 컷 1장 이상, 가로 1000px 이상. 배경이 깔끔할수록 좋습니다.</td></tr>
<tr><th>수출 단가 <i>필수</i></th><td>FOB 기준 USD. 소매가가 아니라 수출·도매가입니다. 수량 구간별 단가가 있으면 더 좋습니다.</td></tr>
<tr><th>MOQ <i>필수</i></th><td>최소주문수량과, 소량 테스트 오더 협의 가능 여부.</td></tr>
<tr><th>제품 규격 <i>필수</i></th><td>용량/중량, 박스 입수량, 카톤 치수·무게. 운임 견적에 필요합니다.</td></tr>
<tr><th>상세페이지</th><td>기존 쇼핑몰 상세페이지 이미지를 그대로 주셔도 됩니다(세로로 긴 이미지 여러 장 가능). 없으면 제품 설명 텍스트로 대신합니다.</td></tr>
<tr><th>인증·시험성적</th><td>기능성 심사, 시험성적서, 특허, ISO/IATF 등. 바이어 신뢰에 가장 크게 작용합니다.</td></tr>
<tr><th>회사 소개</th><td>설립연도, 대표, 주요 거래처·수출 실적, 생산능력. 기업 프로필 페이지에 들어갑니다.</td></tr>
<tr><th>카탈로그 PDF</th><td>있으면 바이어가 다운로드할 수 있게 걸어둡니다.</td></tr>
<tr><th>영상</th><td>유튜브 링크면 충분합니다. 상세페이지에 임베드됩니다.</td></tr>
</table>
<div class="gdoc-note">사진이 마땅치 않아도 일단 보내주세요. 쓸 수 있는 수준인지 확인하고, 부족하면 어떤 컷이 필요한지 목록으로 알려드립니다.</div>`,
    vi:`<h1>Checklist tư liệu</h1>
<p class="gdoc-lead">Gửi theo danh sách này, việc đăng xong trong một lần. Không cần đủ hết mới bắt đầu — bốn mục <b>bắt buộc</b> là cốt lõi.</p>
<table class="gdoc-table">
<tr><th>Ảnh đại diện <i>bắt buộc</i></th><td>Ít nhất 1 ảnh sản phẩm riêng, ngang từ 1000px. Nền càng sạch càng tốt.</td></tr>
<tr><th>Giá xuất khẩu <i>bắt buộc</i></th><td>USD theo FOB — giá xuất/sỉ, không phải giá lẻ. Có bảng giá theo số lượng càng tốt.</td></tr>
<tr><th>MOQ <i>bắt buộc</i></th><td>Số lượng tối thiểu và có nhận đơn thử nhỏ không.</td></tr>
<tr><th>Quy cách <i>bắt buộc</i></th><td>Dung tích/khối lượng, số cái mỗi hộp, kích thước & cân nặng carton — cần cho báo giá cước.</td></tr>
<tr><th>Trang chi tiết</th><td>Gửi nguyên ảnh trang chi tiết đang dùng (nhiều ảnh dọc dài đều được). Không có thì thay bằng mô tả chữ.</td></tr>
<tr><th>Chứng nhận · kiểm nghiệm</th><td>Chứng nhận chức năng, phiếu kiểm nghiệm, bằng sáng chế, ISO/IATF — tác động lớn nhất tới niềm tin.</td></tr>
<tr><th>Giới thiệu công ty</th><td>Năm thành lập, đại diện, khách hàng & thành tích, năng lực sản xuất.</td></tr>
<tr><th>Catalogue PDF</th><td>Nếu có, gắn cho nhà mua tải về.</td></tr>
<tr><th>Video</th><td>Link YouTube là đủ — nhúng vào trang chi tiết.</td></tr>
</table>
<div class="gdoc-note">Ảnh chưa ưng vẫn cứ gửi. Chúng tôi xem có dùng được không, thiếu góc nào sẽ gửi danh sách cụ thể.</div>`,
    en:`<h1>Materials checklist</h1>
<p class="gdoc-lead">Send per this list and listing finishes in one pass. The four <b>required</b> items are the core.</p>
<table class="gdoc-table">
<tr><th>Hero photo <i>required</i></th><td>At least one standalone shot, 1000px+ wide. Clean background preferred.</td></tr>
<tr><th>Export price <i>required</i></th><td>USD on FOB — export/wholesale, not retail. Volume tiers welcome.</td></tr>
<tr><th>MOQ <i>required</i></th><td>Minimum quantity, and whether trial orders are negotiable.</td></tr>
<tr><th>Specs <i>required</i></th><td>Volume/weight, units per box, carton size & weight — needed for freight quotes.</td></tr>
<tr><th>Detail page</th><td>Existing shop detail images are fine as-is (multiple tall images OK). Plain text works too.</td></tr>
<tr><th>Certifications & tests</th><td>Approvals, test reports, patents, ISO/IATF — the biggest trust driver.</td></tr>
<tr><th>Company intro</th><td>Founding year, CEO, clients & export record, capacity.</td></tr>
<tr><th>Catalogue PDF</th><td>Attached for buyers to download.</td></tr>
<tr><th>Video</th><td>A YouTube link is enough — embedded on the page.</td></tr>
</table>
<div class="gdoc-note">Not proud of the photos? Send anyway — we'll check usability and send a shot list for gaps.</div>`}},
]},

{ label:{ko:'부록',vi:'Phụ lục',en:'Appendix'},
  icon:'<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17V4"/></svg>',
  items:[
  { id:'glossary', title:{ko:'무역 용어 사전',vi:'Từ điển thuật ngữ',en:'Trade glossary'},
    body:{
    ko:`<h1>무역 용어 사전</h1>
<p class="gdoc-lead">제조사와 대화할 때 반복해서 나오는 용어들입니다. 이것만 알아도 문의가 훨씬 매끄러워집니다.</p>
<table class="gdoc-table">
<tr><th>MOQ</th><td>최소주문수량. 협의 가능한 경우가 많으니 희망 수량을 먼저 말해보세요.</td></tr>
<tr><th>FOB</th><td>"선적항에서 배에 실을 때까지"의 가격. 그 뒤 운임·보험·관세는 바이어 부담. 메이크노브 가격은 대부분 FOB입니다.</td></tr>
<tr><th>CIF</th><td>도착항까지 운임·보험 포함 가격. FOB보다 비싸 보여도 총비용은 비슷할 수 있습니다.</td></tr>
<tr><th>리드타임</th><td>발주 확정부터 선적까지. 주문 생산이면 30~60일이 보통입니다.</td></tr>
<tr><th>T/T</th><td>은행 송금. 첫 거래는 보통 <b>선금 30% + 선적 전 잔금 70%</b>.</td></tr>
<tr><th>L/C</th><td>신용장 — 은행이 지급을 보증. 거래 이력이 쌓이면 쓸 수 있는 곳이 많습니다.</td></tr>
<tr><th>C/O</th><td>원산지증명서. 한-베 FTA(VKFTA) 관세 혜택에 필요 — 제조사에 요청하세요.</td></tr>
<tr><th>PI</th><td>견적송장. 계약 전 최종 조건을 담은 문서 — 이걸 기준으로 송금합니다.</td></tr>
<tr><th>OEM / ODM</th><td>OEM은 바이어 브랜드로 생산, ODM은 제조사 제품을 바이어 브랜드로 공급.</td></tr>
<tr><th>샘플 오더</th><td>본 발주 전 소량 확인 주문. 비용은 보통 바이어 부담, 본 발주 시 차감해 주기도.</td></tr>
<tr><th>HS코드</th><td>관세 품목분류 번호. 관세율·수입 요건이 이걸로 정해지니 PI에 명시 요청.</td></tr>
</table>`,
    vi:`<h1>Từ điển thuật ngữ</h1>
<p class="gdoc-lead">Những thuật ngữ lặp lại liên tục khi trao đổi với nhà sản xuất.</p>
<table class="gdoc-table">
<tr><th>MOQ</th><td>Số lượng tối thiểu. Thường thương lượng được — nói số lượng bạn muốn trước.</td></tr>
<tr><th>FOB</th><td>Giá "đến khi hàng lên tàu tại cảng xuất". Cước, bảo hiểm, thuế sau đó do nhà mua chịu. Giá MAKENOV phần lớn theo FOB.</td></tr>
<tr><th>CIF</th><td>Giá gồm cước & bảo hiểm đến cảng đích. Cao hơn FOB nhưng tổng chi phí có thể tương đương.</td></tr>
<tr><th>Lead time</th><td>Từ chốt đơn đến xuất hàng. Sản xuất theo đơn thường 30–60 ngày.</td></tr>
<tr><th>T/T</th><td>Chuyển khoản. Đơn đầu thường <b>cọc 30% + 70% trước giao</b>.</td></tr>
<tr><th>L/C</th><td>Thư tín dụng — ngân hàng bảo lãnh. Nhiều nơi chấp nhận khi có lịch sử.</td></tr>
<tr><th>C/O</th><td>Chứng nhận xuất xứ. Cần cho ưu đãi thuế VKFTA — yêu cầu nhà sản xuất cấp.</td></tr>
<tr><th>PI</th><td>Hóa đơn chiếu lệ — điều kiện cuối trước hợp đồng; chuyển tiền dựa trên PI.</td></tr>
<tr><th>OEM / ODM</th><td>OEM: theo thương hiệu của bạn. ODM: sản phẩm nhà máy mang thương hiệu bạn.</td></tr>
<tr><th>Đơn mẫu</th><td>Đơn nhỏ kiểm tra trước đơn chính. Phí thường nhà mua chịu, có nơi trừ lại.</td></tr>
<tr><th>Mã HS</th><td>Mã hải quan — quyết định thuế và điều kiện nhập. Yêu cầu ghi trong PI.</td></tr>
</table>`,
    en:`<h1>Trade glossary</h1>
<p class="gdoc-lead">The terms that come up constantly with manufacturers.</p>
<table class="gdoc-table">
<tr><th>MOQ</th><td>Minimum order quantity. Often negotiable — state your target first.</td></tr>
<tr><th>FOB</th><td>Price up to loading at the export port. Freight, insurance, duties after that are the buyer's. MAKENOV prices are mostly FOB.</td></tr>
<tr><th>CIF</th><td>Includes freight & insurance to destination. Higher than FOB but totals can match.</td></tr>
<tr><th>Lead time</th><td>Confirmed order to shipment. Made-to-order runs 30–60 days.</td></tr>
<tr><th>T/T</th><td>Bank wire. First orders: <b>30% deposit + 70% before shipment</b>.</td></tr>
<tr><th>L/C</th><td>Letter of credit — bank-guaranteed. Accepted once a record exists.</td></tr>
<tr><th>C/O</th><td>Certificate of Origin. Needed for FTA tariff benefits — ask the maker.</td></tr>
<tr><th>PI</th><td>Proforma Invoice — final terms before contract; you wire against it.</td></tr>
<tr><th>OEM / ODM</th><td>OEM: made under your brand. ODM: factory design under your brand.</td></tr>
<tr><th>Sample order</th><td>Small check order first. Usually buyer-paid, sometimes credited back.</td></tr>
<tr><th>HS code</th><td>Customs classification — sets duty and import rules. Ask for it on the PI.</td></tr>
</table>`}},
  { id:'flow', title:{ko:'수입 절차 흐름',vi:'Quy trình nhập khẩu',en:'The import flow'},
    body:{
    ko:`<h1>견적 이후, 수입까지</h1>
<p class="gdoc-lead">견적을 받았다면 그 다음은 일반적인 수입 절차입니다. 첫 거래 기준입니다.</p>
<ol class="gdoc-ol big">
<li><b>견적 확인</b> — 단가·MOQ·납기·결제조건. 빠진 항목은 이 단계에서 다 물어보세요.</li>
<li><b>샘플</b> — 소량으로 품질 확인. 샘플비·특송비는 보통 바이어 부담.</li>
<li><b>조건 확정 → PI 수령</b> — 품목·수량·단가·납기·결제조건·HS코드가 다 들어 있는지 확인. <b>말로 한 약속은 PI에 적혀야 유효합니다.</b></li>
<li><b>결제</b> — 첫 거래는 T/T 선금 30%가 일반적. 수취 계좌명이 계약 상대와 일치하는지 확인.</li>
<li><b>생산·선적</b> — 선적 후 B/L·인보이스·패킹리스트·C/O를 받습니다.</li>
<li><b>통관·수령</b> — 포워더에 서류를 넘기고 관세·VAT 납부 후 수령.</li>
</ol>
<div class="gdoc-note">화장품·식품·의료기기는 베트남 수입 전 제품 공고(등록)가 선행돼야 합니다. 제조사에 "공고용 서류를 줄 수 있는지" 먼저 확인하면 시행착오가 줄어듭니다.</div>`,
    vi:`<h1>Sau báo giá, đến nhập khẩu</h1>
<p class="gdoc-lead">Có báo giá rồi thì phần còn lại là quy trình nhập khẩu thông thường — theo lần giao dịch đầu.</p>
<ol class="gdoc-ol big">
<li><b>Xem báo giá</b> — đơn giá, MOQ, giao hàng, thanh toán. Thiếu gì hỏi ngay bước này.</li>
<li><b>Hàng mẫu</b> — kiểm tra chất lượng. Phí mẫu, chuyển phát thường nhà mua chịu.</li>
<li><b>Chốt điều kiện → nhận PI</b> — kiểm tra đủ mặt hàng, số lượng, đơn giá, giao hàng, thanh toán, mã HS. <b>Thỏa thuận miệng chỉ có giá trị khi ghi vào PI.</b></li>
<li><b>Thanh toán</b> — đơn đầu thường T/T cọc 30%. Đối chiếu tên tài khoản nhận với công ty ký kết.</li>
<li><b>Sản xuất & xuất hàng</b> — sau xuất nhận B/L, invoice, packing list, C/O.</li>
<li><b>Thông quan & nhận hàng</b> — chuyển hồ sơ cho forwarder, nộp thuế & VAT rồi nhận.</li>
</ol>
<div class="gdoc-note">Mỹ phẩm, thực phẩm, thiết bị y tế phải công bố sản phẩm trước khi nhập vào Việt Nam. Hỏi trước nhà sản xuất về hồ sơ công bố sẽ đỡ thử sai.</div>`,
    en:`<h1>After the quote: importing</h1>
<p class="gdoc-lead">With a quote in hand, the rest is a standard import flow — first-transaction edition.</p>
<ol class="gdoc-ol big">
<li><b>Review the quote</b> — price, MOQ, delivery, payment. Ask about gaps now.</li>
<li><b>Samples</b> — check quality small. Sample and courier costs are usually yours.</li>
<li><b>Fix terms → receive the PI</b> — confirm items, quantity, price, delivery, payment and HS code. <b>Verbal promises only count once written into the PI.</b></li>
<li><b>Payment</b> — typically 30% T/T deposit first. Match the receiving account to the contracting company.</li>
<li><b>Production & shipment</b> — then B/L, invoice, packing list and C/O.</li>
<li><b>Customs & delivery</b> — forwarder, duty and VAT, then your goods.</li>
</ol>
<div class="gdoc-note">Cosmetics, food and medical devices need product notification before import. Ask the maker about the dossier up front.</div>`}},
  { id:'trouble', title:{ko:'자주 막히는 곳',vi:'Chỗ hay vướng',en:'Where people get stuck'},
    body:{
    ko:`<h1>자주 막히는 곳</h1>
<p class="gdoc-lead">상황별 정리입니다. 여기 없는 문제는 <a href="support.html">고객센터</a>로 — 영업일 2일 이내 답합니다.</p>
<div class="faq-list">
<details class="faq-item"><summary>사업자 인증이 통과되지 않아요</summary><div class="a">번호가 정확한지, 폐업·휴업 상태가 아닌지 먼저 확인하세요. 베트남 MST는 하이픈 없이 숫자만. 그래도 안 되면 가입 화면의 <b>간편 문의</b>로 — 담당자가 직접 인증을 도와드립니다.</div></details>
<details class="faq-item"><summary>가입은 했는데 로그인이 안 돼요</summary><div class="a">대부분 확인 메일을 안 누른 경우입니다. 받은편지함·스팸함 확인. 로그인 화면에 <b>확인 메일 재발송</b> 버튼도 있습니다.</div></details>
<details class="faq-item"><summary>로그인했는데 가격이 계속 잠겨 있어요</summary><div class="a">계정이 인증 상태가 아니라는 뜻입니다. 로그아웃 후 재로그인 → 같으면 <b>마이페이지 → 기업 프로필 → 재인증하기</b>. 그래도 잠겨 있으면 고객센터로.</div></details>
<details class="faq-item"><summary>하트를 눌러도 관심제품에 안 담겨요</summary><div class="a">로그인 상태인지 확인하세요. 저장 실패 시 화면에 안내가 뜹니다. 담긴 목록은 <b>마이페이지 → 관심제품</b>에서 확인합니다.</div></details>
<details class="faq-item"><summary>문의를 보냈는데 답이 없어요</summary><div class="a">제조사 답변은 보통 영업일 1~3일. 3일이 지나면 고객센터에 제품명과 함께 알려주세요 — 저희가 직접 확인합니다.</div></details>
<details class="faq-item"><summary>회사 정보가 바뀌었어요</summary><div class="a">회사명·등록번호·주소는 <b>재인증하기</b>로, 담당자 이름·연락처는 <b>정보 수정</b>으로 — 둘 다 마이페이지 기업 프로필에 있습니다.</div></details>
</div>
<div class="gdoc-cta"><a class="btn btn-primary" href="support.html">고객센터로 문의하기</a></div>`,
    vi:`<h1>Chỗ hay vướng</h1>
<p class="gdoc-lead">Sắp theo tình huống. Không có ở đây thì gửi <a href="support.html">hỗ trợ</a> — trả lời trong 2 ngày làm việc.</p>
<div class="faq-list">
<details class="faq-item"><summary>Xác thực doanh nghiệp không qua</summary><div class="a">Kiểm tra mã số đúng chưa, doanh nghiệp còn hoạt động không. MST nhập số liền không gạch. Vẫn không được → dùng <b>gửi yêu cầu nhanh</b> ở màn hình đăng ký, chúng tôi xác thực trực tiếp.</div></details>
<details class="faq-item"><summary>Đăng ký rồi mà không đăng nhập được</summary><div class="a">Phần lớn do chưa bấm email xác nhận. Kiểm tra hộp thư & spam. Có nút <b>gửi lại thư</b> ở màn hình đăng nhập.</div></details>
<details class="faq-item"><summary>Đăng nhập rồi mà giá vẫn khóa</summary><div class="a">Tài khoản chưa ở trạng thái xác thực. Đăng xuất/vào lại → vẫn vậy thì <b>Trang của tôi → Hồ sơ → Xác thực lại</b>. Vẫn khóa → báo hỗ trợ.</div></details>
<details class="faq-item"><summary>Bấm tim mà không lưu vào quan tâm</summary><div class="a">Kiểm tra đã đăng nhập chưa. Lưu thất bại sẽ có thông báo. Danh sách ở <b>Trang của tôi → Quan tâm</b>.</div></details>
<details class="faq-item"><summary>Gửi yêu cầu mà không có hồi âm</summary><div class="a">Thường 1–3 ngày làm việc. Quá 3 ngày → báo hỗ trợ kèm tên sản phẩm, chúng tôi xác nhận trực tiếp.</div></details>
<details class="faq-item"><summary>Thông tin công ty thay đổi</summary><div class="a">Tên/mã số/địa chỉ: <b>Xác thực lại</b>. Người phụ trách: <b>Sửa thông tin</b> — đều trong hồ sơ doanh nghiệp.</div></details>
</div>
<div class="gdoc-cta"><a class="btn btn-primary" href="support.html">Liên hệ hỗ trợ</a></div>`,
    en:`<h1>Where people get stuck</h1>
<p class="gdoc-lead">By situation. Anything else → <a href="support.html">support</a>, answered within two business days.</p>
<div class="faq-list">
<details class="faq-item"><summary>Verification won't pass</summary><div class="a">Check the number and that the business is active. MST is digits only. Still failing → the sign-up screen's <b>quick enquiry</b>; we verify manually.</div></details>
<details class="faq-item"><summary>Signed up but can't log in</summary><div class="a">Usually the confirmation email. Check inbox/spam; there's a <b>resend</b> button on the login screen.</div></details>
<details class="faq-item"><summary>Logged in but prices stay locked</summary><div class="a">The account isn't verified yet. Re-login → then <b>My page → Profile → Re-verify</b>. Still locked → support.</div></details>
<details class="faq-item"><summary>Hearts don't save to my wishlist</summary><div class="a">Check you're logged in. Failed saves show a message. The list lives at <b>My page → Wishlist</b>.</div></details>
<details class="faq-item"><summary>No reply to my request</summary><div class="a">Usually 1–3 business days. Past three → tell support with the product name; we check directly.</div></details>
<details class="faq-item"><summary>Company details changed</summary><div class="a">Name/number/address: <b>Re-verify</b>. Contact person: <b>Edit details</b> — both in the company profile.</div></details>
</div>
<div class="gdoc-cta"><a class="btn btn-primary" href="support.html">Contact support</a></div>`}},
]},
];

/* ---------- 렌더 ---------- */
const GD_FLAT = GD.flatMap(g=>g.items);
let gdCur = 'welcome';

function gdSide(){
  document.getElementById('gdoc-side').innerHTML = GD.map(g=>`
    <div class="gdoc-g"><span>${g.icon}<i>${esc(L(g.label))}</i></span>
      ${g.items.map(a=>`<a href="#${a.id}" data-art="${a.id}" class="${a.id===gdCur?'on':''}">${esc(L(a.title))}</a>`).join('')}
    </div>`).join('')
    + `<div class="gdoc-g"><a href="support.html">${esc(t('nav_support'))} ↗</a></div>`;
}
function gdMain(){
  const idx = GD_FLAT.findIndex(a=>a.id===gdCur);
  const art = GD_FLAT[idx] || GD_FLAT[0];
  const grp = GD.find(g=>g.items.includes(art));
  const prev = GD_FLAT[idx-1], next = GD_FLAT[idx+1];
  document.getElementById('gdoc-main').innerHTML = `
    <div class="gdoc-crumb">${esc(L(grp.label))} › <b>${esc(L(art.title))}</b></div>
    ${L(art.body)}
    <div class="gdoc-pn">
      ${prev?`<a href="#${prev.id}" data-art="${prev.id}"><i>←</i><span>${esc(L(prev.title))}</span></a>`:'<span></span>'}
      ${next?`<a class="nx" href="#${next.id}" data-art="${next.id}"><span>${esc(L(next.title))}</span><i>→</i></a>`:'<span></span>'}
    </div>`;
}
function showArt(id){
  if(!GD_FLAT.some(a=>a.id===id)) return;
  gdCur = id;
  gdSide(); gdMain();
  window.scrollTo({top:0});
}
document.addEventListener('click', e=>{
  const a = e.target.closest('a[data-art]');
  if(!a) return;
  e.preventDefault();
  history.replaceState(null,'','#'+a.dataset.art);
  showArt(a.dataset.art);
});
function pageInit(){
  const id = location.hash.replace('#','');
  if(GD_FLAT.some(a=>a.id===id)) gdCur = id;
  gdSide(); gdMain();
}
</script>
</body>
</html>
