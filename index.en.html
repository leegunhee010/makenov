<script>
let heroIdx = 0, heroTimer = null;

/* ---------- 히어로 슬라이더 ----------
   제품 자랑이 아니라 플랫폼 메시지를 거는 자리.
   배경은 브랜드 컬러로 직접 그린 SVG 아트(assets/img/hero/). */
function renderHero(){
  const slides = MK_HERO;
  if(!slides.length) return;
  if(heroIdx >= slides.length) heroIdx = 0;

  document.getElementById('hero-frame').innerHTML =
    slides.map((s,i)=>`
      <div class="slide ${i===heroIdx?'on':''}"><a class="shot" href="${s.link||'directory.html'}"><img src="${mkAsset(s.art)}" alt=""></a><div class="veil"></div><div class="copy">${i===0?'<h1>':'<h2>'}${esc(L(s.title)).replace(/\n/g,'<br>')}${i===0?'</h1>':'</h2>'}<p>${esc(L(s.sub))}</p></div></div>`).join('') +
    `<div class="dots">${slides.map((_,i)=>
      `<i class="${i===heroIdx?'on':''}" onclick="setHero(${i})"></i>`).join('')}</div><div class="hero-arrows"><button onclick="setHero(heroIdx-1)" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button onclick="setHero(heroIdx+1)" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>`;
  applyI18n(document.getElementById('hero-frame'));
}

/* 좌측 카테고리 레일 — 등록 제품이 있는 카테고리만, 개수와 함께.
   addwel은 아이콘에 이모지를 쓰지만 우리는 쓰지 않는다(기기마다 모양이 달라진다). */
function renderCatRail(){
  const el = document.getElementById('hero-cats');
  if(!el) return;
  const rows = MK_CATEGORIES
    .map(c => ({ c, n: MK_PRODUCTS.filter(p => p.cat === c.id).length }))
    .filter(x => x.n > 0);
  el.innerHTML = `
    <a class="all" href="directory.html"><span data-i18n="cat_all"></span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></a><ul>${rows.map(({c,n})=>`
      <li><a href="directory.html?category=${c.id}"><span>${esc(L(c.name))}</span><span class="n">${n}</span></a></li>`).join('')}</ul>`;
  applyI18n(el);
}

/* 회전은 클래스만 토글한다 — innerHTML을 다시 그리면 이미지가 매번 새로 로드돼 화면이 깜빡인다 */
function setHero(i){
  const frame = document.getElementById('hero-frame');
  const slides = frame.querySelectorAll('.slide');
  if(!slides.length) return;
  heroIdx = ((i % slides.length) + slides.length) % slides.length;
  slides.forEach((el,n)=>el.classList.toggle('on', n===heroIdx));
  frame.querySelectorAll('.dots i').forEach((el,n)=>el.classList.toggle('on', n===heroIdx));
}

/* FAQ — 이모지·알약 금지 원칙에 맞춘 텍스트 아코디언 */
function renderFaq(){
  const el = document.getElementById('faq-list');
  if(!el) return;
  const list = (typeof MK_FAQ !== 'undefined' ? MK_FAQ : [])
    .filter(f => f.published !== false && (f.page || 'home') === 'home')
    .sort((a,b) => (a.sort||0) - (b.sort||0));
  el.innerHTML = list.map(f => `
    <details class="faq-item"><summary>${esc(L(f.q))}</summary><div class="a">${esc(L(f.a))}</div></details>`).join('');
}

function pageInit(){
  /* 히어로 */
  renderHero();
  renderCatRail();
  renderFaq();
  clearInterval(heroTimer);
  heroTimer = setInterval(()=>setHero(heroIdx+1), 5000);

  /* 추천 */
  document.getElementById('featured-grid').innerHTML =
    MK_PRODUCTS.filter(p=>p.featured).slice(0,4).map(productCard).join('');

  /* 신규 — 텍스트 리스트형 */
  document.getElementById('new-list').innerHTML =
    [...MK_PRODUCTS].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,4).map(productCard).join('');

  /* 새로운 소식 — 칼럼 카드.
     예전엔 제목만 있는 2열 텍스트 리스트라 허전했다.
     칼럼 목록 페이지와 같은 카드 문법(.col-card)을 써서 사이트 안에서 톤을 맞춘다. */
  document.getElementById('news-list').innerHTML = MK_COLUMNS.slice(0,3).map(c=>`
    <a class="col-card" href="column.html?id=${c.id}"><div class="thumb"><img src="${c.img}" alt="${esc(L(c.title))}" loading="lazy"></div><div class="body">${c.cat?`<span class="cat">${esc(L(c.cat))}</span>`:''}<h3>${esc(L(c.title))}</h3><p>${esc(L(c.excerpt))}</p><div class="date">${c.date}</div></div></a>`).join('');
}
</script>
