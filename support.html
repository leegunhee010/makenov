<body>
<header class="mk-header" id="mk-header"></header>

<main>

  <section class="lp-hero">
    <div class="lp-wrap">
      <div class="lp-kick" data-i18n="sp_kick"></div>
      <h1 data-i18n="sp_title"></h1>
      <p class="lead" data-i18n="sp_lead"></p>
    </div>
  </section>

  <!-- 연락 수단 -->
  <section class="lp-sec">
    <div class="lp-wrap">
      <div class="lp-cards">
        <a class="lp-card" href="mailto:contact@makenov.com">
          <h3 data-i18n="sp_c1_t"></h3>
          <p data-i18n="sp_c1_d"></p>
          <b class="sp-val">contact@makenov.com</b>
        </a>
        <a class="lp-card" href="maker.html">
          <h3 data-i18n="sp_c2_t"></h3>
          <p data-i18n="sp_c2_d"></p>
          <b class="sp-val" data-i18n="kr_cta_btn"></b>
        </a>
        <a class="lp-card" href="index.html#faq">
          <h3 data-i18n="sp_c3_t"></h3>
          <p data-i18n="sp_c3_d"></p>

        </a>
      </div>

      <div class="sp-hours">
        <h4 data-i18n="sp_hours_t"></h4>
        <p data-i18n="sp_hours_d"></p>
      </div>
    </div>
  </section>

  <!-- 문의 폼 -->
  <section class="lp-sec soft">
    <div class="lp-wrap">
      <div class="lp-head">
        <div class="tag" data-i18n="sp_form_tag"></div>
        <h2 data-i18n="sp_form_title"></h2>

      <div class="sp-form" id="sp-form">

        <div class="f-2col">
          <div class="f-row"><label data-i18n="auth_company"></label><input id="sp-company"></div>
          <div class="f-row"><label data-i18n="auth_contact_name"></label><input id="sp-name"></div>
        </div>
        <div class="f-2col">
          <div class="f-row"><label data-i18n="auth_email"></label><input id="sp-email" type="email"></div>
          <div class="f-row"><label data-i18n="auth_phone"></label><input id="sp-tel" inputmode="tel"></div>
        </div>
        <div class="f-row"><label data-i18n="easy_need"></label>
          <textarea id="sp-msg" rows="5" data-i18n-ph="easy_need_ph"></textarea></div>
        <button class="btn btn-primary btn-block" onclick="sendSupport()" data-i18n="sp_send"></button>
      </div>
    </div>

<script src="assets/js/upload.js?v=20260804n"></script>
<script src="assets/js/store-supabase.js?v=20260804n"></script>
<script src="assets/js/app.js?v=20260804n"></script>
<script>
/* 고객센터 문의 — 가입 없이 접수. 관리자 '입점문의' 탭에 cat=support 로 들어간다. */
async function sendSupport(){
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById('sp-err');
  const show = m => { err.textContent = m; err.style.display = 'block'; err.scrollIntoView({block:'center'}); };

  if(!v('sp-name'))                    return show(t('auth_need_basic'));
  if(!v('sp-email') && !v('sp-tel'))   return show(t('easy_need_contact'));
  if(!v('sp-msg'))                     return show(t('easy_need'));
  err.style.display = 'none';

  const btn = document.querySelector('#sp-form .btn-primary');
  btn.disabled = true;

  /* ★ 저장 결과를 확인하고 나서 완료 화면으로 넘긴다 — 실패했는데 접수됐다고 하면 문의가 조용히 사라진다 */
  const res = await Store.addMakerLead({
    company: v('sp-company') || '-', name: v('sp-name'),
    tel: v('sp-tel') || '-', email: v('sp-email') || '-',
    site: '', cat: 'support',
    message: '[고객센터 문의] ' + v('sp-msg'),
  });
  btn.disabled = false;

  if(!res || res.ok === false){ show(t('inq_err')); return; }

  mkTrack('Contact', { content_category:'support' });
  document.getElementById('sp-form').innerHTML =
    `<div class="lp-done"><h3>${esc(t('sp_ok'))}</h3></div>`;
}
</script>
</body>
