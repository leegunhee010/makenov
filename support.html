<body>
<header class="mk-header" id="mk-header"></header>

<main class="wrap">
  <!-- 고객센터 — addwel.co.kr/bbs/notice 실측 구조:
       페이지 타이틀 → 3등분 폴더 탭(공지사항/FAQ/1:1 문의) → 게시판 -->
  <div class="page-head" style="padding-bottom:14px"><h1 data-i18n="sp_kick"></h1></div>
  <div class="nb-tabs" id="nb-tabs"></div>
  <div class="nb-body" id="nb-body"></div>
</main>

<footer class="mk-footer" id="mk-footer"></footer>
<script src="assets/js/config.js?v=20260804s"></script>
<script src="assets/js/pixel.js?v=20260804s"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/i18n.js?v=20260804s"></script>
<script src="assets/js/data.js?v=20260804s"></script>
<script src="assets/js/store.js?v=20260804s"></script>
<script src="assets/js/verify.js?v=20260804s"></script>
<script src="assets/js/upload.js?v=20260804s"></script>
<script src="assets/js/store-supabase.js?v=20260804s"></script>
<script src="assets/js/app.js?v=20260804s"></script>
<script>
/* 상태: 탭(notice|faq|ask), 공지 상세 id, 검색어, 구분 필터, 페이지 */
let spTab='notice', spId=null, spQ='', spCat='all', spPage=1;
const PER = 20;
const NT_CATS = ['all','notice','new','update','event'];

function spTabs(){
  const tabs = [
    {id:'notice', key:'sp_m_notice'},
    {id:'faq',    key:'sec_faq'},
    {id:'ask',    key:'sp_m_ask'},
  ];
  document.getElementById('nb-tabs').innerHTML = tabs.map(x=>`
    <a href="#${x.id}" data-tab="${x.id}" class="${x.id===spTab?'on':''}">${esc(t(x.key))}</a>`).join('');
}

/* ---------- 공지사항 (addwel 게시판 문법) ---------- */
function noticeList(){
  const all = (typeof MK_NOTICES!=='undefined'?MK_NOTICES:[]).filter(n=>n.published!==false);
  let list = all
    .filter(n=>spCat==='all' || (n.cat||'notice')===spCat)
    .filter(n=>!spQ || L(n.title).toLowerCase().includes(spQ.toLowerCase()));
  /* 고정글 먼저, 그 안에서 최신순 */
  list.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || String(b.date).localeCompare(String(a.date)));

  const pages = Math.max(1, Math.ceil(list.length/PER));
  if(spPage>pages) spPage = pages;
  const rows = list.slice((spPage-1)*PER, spPage*PER);

  return `
    <div class="nb-bar">
      <div class="nb-search">
        <input id="nb-q" value="${esc(spQ)}" placeholder="${esc(t('nt_search_ph'))}"
          onkeydown="if(event.key==='Enter')ntSearch()">
        <button class="btn btn-primary btn-sm" onclick="ntSearch()">${esc(t('nt_search'))}</button>
        <button class="btn btn-ghost btn-sm" onclick="spQ='';spCat='all';spPage=1;spRender()">${esc(t('nt_reset'))}</button>
      </div>
      <div class="nb-cats">${NT_CATS.map(c=>`
        <button class="${spCat===c?'on':''}" onclick="spCat='${c}';spPage=1;spRender()">${esc(t('nt_cat_'+c))}</button>`).join('')}</div>
    </div>
    <div class="nb-total">${esc(t('nt_total').replace('{n}', list.length))}</div>
    <div class="tbl-wrap-pub"><table class="nb-table">
      <thead><tr><th class="no">${esc(t('nt_th_no'))}</th><th class="cat">${esc(t('nt_th_cat'))}</th><th>${esc(t('nt_th_title'))}</th><th class="dt">${esc(t('nt_th_date'))}</th></tr></thead>
      <tbody>${rows.length ? rows.map((n,i)=>`
        <tr onclick="spId='${n.id}';history.replaceState(null,'','#notice-${n.id}');spRender()">
          <td class="no">${(spPage-1)*PER + i + 1}</td>
          <td class="cat">${esc(t('nt_cat_'+(n.cat||'notice')))}</td>
          <td class="tt">${n.pinned?`<i class="top">TOP</i>`:''}<span>${esc(L(n.title))}</span></td>
          <td class="dt">${esc(String(n.date).replace(/-/g,'.'))}</td>
        </tr>`).join('') : `<tr><td colspan="4" class="nb-empty">${esc(t('nt_no_result'))}</td></tr>`}
      </tbody></table></div>
    ${pages>1?`<div class="nb-pages">${Array.from({length:pages},(_,i)=>`
      <button class="${spPage===i+1?'on':''}" onclick="spPage=${i+1};spRender()">${i+1}</button>`).join('')}</div>`:''}`;
}
function ntSearch(){
  spQ = document.getElementById('nb-q').value.trim();
  spPage = 1; spRender();
}

function noticeDetail(){
  const n = (typeof MK_NOTICES!=='undefined'?MK_NOTICES:[]).find(x=>x.id===spId);
  if(!n){ spId=null; return noticeList(); }
  return `
    <div class="nb-view">
      <div class="hd">
        <span class="cat">${esc(t('nt_cat_'+(n.cat||'notice')))}</span>
        <h2>${n.pinned?`<i class="top">TOP</i>`:''}${esc(L(n.title))}</h2>
        <div class="dt">${esc(String(n.date).replace(/-/g,'.'))}</div>
      </div>
      <div class="bd">${L(n.body)}</div>
      <div class="ft"><a class="btn btn-soft" href="#notice" onclick="spId=null;history.replaceState(null,'','#notice');spRender();return false">${esc(t('sp_back'))}</a></div>
    </div>`;
}

/* ---------- FAQ ---------- */
function faqPane(){
  const list = (typeof MK_FAQ!=='undefined'?MK_FAQ:[])
    .filter(f=>f.published!==false && (f.page||'home')==='home')
    .sort((a,b)=>(a.sort||0)-(b.sort||0));
  return `<div class="nb-pane"><div class="faq-list">${list.map(f=>`
    <details class="faq-item"><summary>${esc(L(f.q))}</summary><div class="a">${esc(L(f.a))}</div></details>`).join('')}</div></div>`;
}

/* ---------- 1:1 문의 ---------- */
function askPane(){
  return `<div class="nb-pane">
    <p class="nb-lead">${esc(t('sp_form_desc'))} ${esc(t('sp_lead'))}</p>
    <div class="sp-form" id="sp-form" style="margin:0;max-width:none;padding:0;background:none">
      <div class="lp-err" id="sp-err"></div>
      <div class="f-2col">
        <div class="f-row"><label>${esc(t('auth_company'))}</label><input id="sp-company"></div>
        <div class="f-row"><label>${esc(t('auth_contact_name'))}</label><input id="sp-name"></div>
      </div>
      <div class="f-2col">
        <div class="f-row"><label>${esc(t('auth_email'))}</label><input id="sp-email" type="email"></div>
        <div class="f-row"><label>${esc(t('auth_phone'))}</label><input id="sp-tel" inputmode="tel"></div>
      </div>
      <div class="f-row"><label>${esc(t('easy_need'))}</label>
        <textarea id="sp-msg" rows="6" placeholder="${esc(t('easy_need_ph'))}"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="sendSupport()">${esc(t('sp_send'))}</button>
    </div>
    <div class="sp-hours" style="max-width:none"><h4>${esc(t('sp_hours_t'))}</h4><p>${esc(t('sp_hours_d'))} · contact@makenov.com</p></div>
  </div>`;
}

function spRender(){
  spTabs();
  document.getElementById('nb-body').innerHTML =
    spTab==='notice' ? (spId ? noticeDetail() : noticeList())
    : spTab==='faq' ? faqPane() : askPane();
}

document.addEventListener('click', e=>{
  const a = e.target.closest('a[data-tab]');
  if(!a) return;
  e.preventDefault();
  spTab = a.dataset.tab; spId = null;
  history.replaceState(null,'','#'+spTab);
  spRender();
});

async function sendSupport(){
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById('sp-err');
  const show = m => { err.textContent = m; err.style.display = 'block'; err.scrollIntoView({block:'center'}); };

  if(!v('sp-name'))                  return show(t('auth_need_basic'));
  if(!v('sp-email') && !v('sp-tel')) return show(t('easy_need_contact'));
  if(!v('sp-msg'))                   return show(t('easy_need'));
  err.style.display = 'none';

  const btn = document.querySelector('#sp-form .btn-primary');
  btn.disabled = true;
  const res = await Store.addMakerLead({
    company: v('sp-company') || '-', name: v('sp-name'),
    tel: v('sp-tel') || '-', email: v('sp-email') || '-',
    site: '', cat: 'support',
    message: '[고객센터 문의] ' + v('sp-msg'),
  });
  btn.disabled = false;
  if(!res || res.ok === false){ show(t('inq_err')); return; }

  mkTrack('Contact', { content_category:'support' });
  document.getElementById('sp-form').innerHTML = `<div class="lp-done"><h3>${esc(t('sp_ok'))}</h3></div>`;
}

function pageInit(){
  const h = location.hash.replace('#','');
  const m = h.match(/^notice-(.+)$/);
  if(m){ spTab='notice'; spId=m[1]; }
  else if(['notice','faq','ask'].includes(h)) spTab = h;
  spRender();
}
</script>
</body>
</html>
